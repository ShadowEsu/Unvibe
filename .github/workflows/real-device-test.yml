name: Real device test

# Installs Unvibe on real macOS and Windows machines (a published release, or the artifacts of a
# build-only "Desktop app release" run so a change is proven before it ships), walks through the
# timed first run, Google sign-in (up to Google's own page), every page, the editor shortcut path
# and the global shortcut, and uploads a screenshot of every step plus a pass/fail report.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to test, without the v (empty = latest on unvibe.site)"
        required: false
        default: ""
      build_run:
        description: "Optional: id of a build-only Desktop app release run to test instead of a release"
        required: false
        default: ""
      media_samples:
        description: "Also record marketing's sample files (app/e2e/media-samples/) in the website media"
        type: boolean
        required: false
        default: false
      samples_only:
        description: "Optional: only these media-samples files, comma-separated (one small AI run: Mac media only, no walkthrough, no Windows job)"
        required: false
        default: ""
      two_app_take:
        description: "Optional: dry or take. Studio's S8: the same sample selected in TextEdit and Terminal, Control+U in each (Mac only, no walkthrough; dry = selections and grabs only, the app isn't started)"
        required: false
        default: ""
      desktop_recording:
        description: "Also record the whole screen around the global-shortcut step (demo video; Mac .mov, Windows JPEG frames)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  walkthrough:
    strategy:
      fail-fast: false
      matrix:
        # samples_only / two_app_take: the Mac job alone (its install and the media step); the Windows job would ask the AI again.
        include: ${{ fromJSON((inputs.samples_only != '' || inputs.two_app_take != '') && '[{"os":"macos-latest","label":"mac"}]' || '[{"os":"macos-latest","label":"mac"},{"os":"windows-latest","label":"windows"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every install this run makes must be flagged as QA, or it counts as a real install in the
      # funnel (29 Oct: a deleted secret made the flag steps skip and 12 CI installs counted as real).
      # So a missing token fails the run here, before anything is installed (BOSS 29 Oct).
      - name: Require the QA flag token
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
        run: |
          if [ -z "$UNVIBE_QA_FLAG_TOKEN" ]; then
            echo "::error::UNVIBE_QA_FLAG_TOKEN is not set, so this run's installs couldn't be flagged as QA. Nothing was installed."
            exit 1
          fi
          echo "QA flag token present"

      # Flag every install id this run will use before anything launches, so a run cancelled or timed
      # out mid-way still leaves only QA rows (run 42120662869 was cancelled before its after-run flag).
      # The route writes a flagged row for an id the API hasn't seen yet (matched false), and the app's
      # first contact keeps it (trialAccess readInstall upserts with ignoreDuplicates). The after-run
      # steps below still require matched true. Security file 2332, B-1..B-4.
      - name: Flag this run's install ids as QA before any launch
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
          WALK_INSTALL_ID: qa-walkthrough-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          MEDIA_INSTALL_ID: qa-media-${{ github.run_id }}-${{ github.run_attempt }}
          PORTABLE_INSTALL_ID: qa-portable-${{ github.run_id }}-${{ github.run_attempt }}
          OS_LABEL: ${{ matrix.label }}
        run: |
          if [ -z "$UNVIBE_QA_FLAG_TOKEN" ]; then echo "::error::no QA flag token; nothing was launched"; exit 1; fi
          ids="$WALK_INSTALL_ID"
          if [ "$OS_LABEL" = mac ]; then ids="$ids $MEDIA_INSTALL_ID"; else ids="$ids $PORTABLE_INSTALL_ID"; fi
          for id in $ids; do
            # The header goes in on stdin (printf is a shell builtin), so the token is never in a process's arguments.
            answer=$(printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -m 30 -w '\n%{http_code}' \
              -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' \
              --data "{\"installId\":\"$id\"}") || { echo "::error::pre-flag $id: curl failed; nothing was launched"; exit 1; }
            code=$(printf '%s' "$answer" | tail -n 1)
            # || true: the runner's bash has -e -o pipefail, and a body without "matched" (a 401) must still reach the error below.
            matched=$(printf '%s' "$answer" | head -n 1 | grep -o '"matched":[a-z]*' | cut -d: -f2) || true
            echo "QA pre-flag $id: $code matched=${matched:-none}"
            if [ "$code" != 200 ] || { [ "$matched" != true ] && [ "$matched" != false ]; }; then
              echo "::error::pre-flag $id was not stored; nothing was launched"; exit 1
            fi
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Pick the version
        id: ver
        shell: bash
        # Dispatch inputs reach shells only through env, never pasted into a script, and are checked here.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_RUN: ${{ inputs.build_run }}
        run: |
          if [ -n "$INPUT_BUILD_RUN" ] && ! [[ "$INPUT_BUILD_RUN" =~ ^[0-9]+$ ]]; then echo "build_run must be a run id (digits only)"; exit 1; fi
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then v=$(curl -fsSL https://unvibe.site/install.sh | sed -n 's/^TAG=".*:-v\([0-9.]*\)}"$/\1/p' | head -1); fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "version must look like 0.1.44"; exit 1; fi
          echo "Testing Unvibe $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Install Playwright (driver, Chromium and its ffmpeg)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.48.2 axe-core@4.12.1 >/dev/null
          # ffmpeg: marketing-media.mjs encodes its window recordings with it.
          npx playwright install chromium ffmpeg

      - name: Get the build-only artifacts
        if: inputs.build_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unvibe-${{ matrix.os }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build

      - name: Install Unvibe (Mac)
        if: matrix.label == 'mac'
        shell: bash
        env:
          V: ${{ steps.ver.outputs.v }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          v="$V"
          arch=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x64)
          if [ -n "$BUILD_RUN" ]; then
            cp "$(ls "$RUNNER_TEMP"/build/*-mac-$arch.dmg | head -1)" "$RUNNER_TEMP/Unvibe.dmg"
          else
            curl -fL -o "$RUNNER_TEMP/Unvibe.dmg" "https://github.com/ShadowEsu/Unvibe/releases/download/v$v/Unvibe-$v-mac-$arch.dmg"
          fi
          mnt="$RUNNER_TEMP/mnt"; mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/Unvibe.dmg"
          ditto "$mnt/Unvibe.app" /Applications/Unvibe.app
          hdiutil detach "$mnt" -force || true
          xattr -cr /Applications/Unvibe.app
          codesign --verify --deep --strict /Applications/Unvibe.app && echo "signature valid"
          # Let Unvibe and the test's keystroke helpers use Accessibility, like a user switching it on.
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          for c in com.unvibe.app com.apple.systemevents com.apple.Terminal; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES('kTCCServiceAccessibility','$c',0,2,4,1,'UNUSED',0);" || true
          done
          for p in /bin/bash /usr/bin/osascript "$(command -v node)" /usr/local/opt/runner/provisioner/provisioner; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES('kTCCServiceAccessibility','$p',1,2,4,1,'UNUSED',0);" || true
          done
          echo "UNVIBE_EXE=/Applications/Unvibe.app/Contents/MacOS/Unvibe" >> "$GITHUB_ENV"

      - name: Install Unvibe (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.v }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          $v = $env:V
          $setup = "$env:RUNNER_TEMP\Unvibe-setup.exe"
          if ($env:BUILD_RUN) {
            Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\build" -Filter '*-win-x64-setup.exe' | Select-Object -First 1).FullName $setup
          } else {
            Invoke-WebRequest -Uri "https://github.com/ShadowEsu/Unvibe/releases/download/v$v/Unvibe-$v-win-x64-setup.exe" -OutFile $setup
          }
          $item = Get-Item $setup
          "setup: $($item.Length) bytes, sha256 $((Get-FileHash $setup -Algorithm SHA256).Hash)"
          $motw = Get-Content $setup -Stream Zone.Identifier -ErrorAction SilentlyContinue
          "zone identifier: $(if ($motw) { $motw -join ' ' } else { 'none' })"
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          "setup exit code: $($proc.ExitCode)"
          # The NSIS installer can hand off to a child process; give the files a moment to land.
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'Unvibe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name, LastWriteTime | Out-String | Write-Host
            Get-Process | Where-Object { $_.ProcessName -match 'Unvibe|setup|nsis' } | Format-Table ProcessName, Id | Out-String | Write-Host
            Write-Error 'Unvibe.exe was not installed'; exit 1
          }
          "UNVIBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Walk through the app
        if: inputs.samples_only == '' && inputs.two_app_take == ''
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
          UNVIBE_OS: ${{ matrix.label }}
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          UNVIBE_E2E_PROFILE: ${{ runner.temp }}/walkthrough-profile
          # Seeded into the profile, so this run's install is known and flagged as QA below.
          E2E_INSTALL_ID: qa-walkthrough-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          # Off unless asked for: the recording is for the demo video, not a check.
          DESKTOP_RECORDING: ${{ inputs.desktop_recording && '1' || '' }}
          DESKTOP_RECORDING_DIR: ${{ runner.temp }}/desktop-recording
        run: |
          cp app/e2e/real-device.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw" && node real-device.mjs
          cat "$SHOTS_DIR/report.txt"

      # The website's Windows download is the portable exe, so open that exact file too.
      - name: Open the portable exe the website serves (Windows)
        if: always() && matrix.label == 'windows' && steps.ver.outputs.v != ''
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.v }}
          BUILD_RUN: ${{ inputs.build_run }}
          # Pre-flagged above; seeded into the profile so the portable app uses it instead of a random id.
          PORTABLE_INSTALL_ID: qa-portable-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $v = $env:V
          $exe = "$env:RUNNER_TEMP\portable\Unvibe.exe"
          New-Item -ItemType Directory -Force (Split-Path $exe), "$env:RUNNER_TEMP\shots" | Out-Null
          if ($env:BUILD_RUN) {
            Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\build" -Filter '*-win-x64-portable.exe' | Select-Object -First 1).FullName $exe
          } else {
            Invoke-WebRequest -Uri "https://github.com/ShadowEsu/Unvibe/releases/download/v$v/Unvibe-$v-win-x64-portable.exe" -OutFile $exe
          }
          "portable: $((Get-Item $exe).Length) bytes, version $((Get-Item $exe).VersionInfo.ProductVersion), sha256 $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $env:UNVIBE_USER_DATA = "$env:RUNNER_TEMP\portable-profile"
          $seed = Join-Path $env:UNVIBE_USER_DATA 'unvibe-store.json'
          New-Item -ItemType Directory -Force $env:UNVIBE_USER_DATA | Out-Null
          # No BOM: the app's JSON.parse would reject one and start a fresh store with a random id.
          if (-not (Test-Path $seed)) { [IO.File]::WriteAllText($seed, (@{ installId = $env:PORTABLE_INSTALL_ID } | ConvertTo-Json -Compress)) }
          Start-Process -FilePath $exe
          $win = $null
          for ($i = 0; $i -lt 45 -and -not $win; $i++) {
            Start-Sleep -Seconds 2
            $win = Get-Process Unvibe -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          }
          if (-not $win) {
            Get-Process | Where-Object { $_.ProcessName -match 'Unvibe' } | Format-Table ProcessName, Id, Path | Out-String | Write-Host
            Write-Error 'The portable exe did not open a window'; exit 1
          }
          "window '$($win.MainWindowTitle)' from $($win.Path)"
          # Still open after 10 seconds: the first run did not crash behind its window.
          Start-Sleep -Seconds 10
          if (-not (Get-Process -Id $win.Id -ErrorAction SilentlyContinue)) { Write-Error 'The portable app closed itself after opening'; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\shots\portable-first-launch.png")
          "PASS  Portable exe opens and stays open"
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          # The seeded store still loads: the id is unchanged and the app added its own keys to it.
          $after = Get-Content $seed -Raw | ConvertFrom-Json -AsHashtable
          "portable store after launch: installId=$($after['installId']) keys=$((@($after.Keys) | Sort-Object) -join ',')"
          if ($after['installId'] -ne $env:PORTABLE_INSTALL_ID) { Write-Error 'The portable app replaced the seeded QA install id'; exit 1 }

      # Leave this run's installs out of founder stats: the walkthrough's profile on both systems and,
      # on Windows, the portable exe's. Only this step has the admin token, and Unvibe is stopped
      # first, so the app under test never runs with it. Runs even after a failed check. Fails when
      # the API answers anything but 200 with matched true: a 200 alone does not prove the app's own
      # install row was flagged (Security, 31 Oct).
      - name: Flag this run's installs as QA
        if: always()
        shell: pwsh
        env:
          # CI-only: this token can flag a test install as QA and nothing else.
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
        run: |
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $env:UNVIBE_QA_FLAG_TOKEN) { 'QA install flag: no token, so these installs count as real'; exit 1 }
          $failed = 0
          foreach ($name in 'walkthrough-profile', 'portable-profile') {
            $store = [IO.Path]::Combine($env:RUNNER_TEMP, $name, 'unvibe-store.json')
            if (-not (Test-Path $store)) { "QA install flag ($name): skipped, no store"; continue }
            try {
              $installId = (Get-Content $store -Raw | ConvertFrom-Json -AsHashtable)['installId']
              if (-not $installId) { "QA install flag ($name): skipped, no installId in the store"; continue }
              $r = Invoke-WebRequest -Method Post -Uri 'https://api.unvibe.site/api/v1/admin/qa-install' -UseBasicParsing `
                -Headers @{ authorization = "Bearer $env:UNVIBE_QA_FLAG_TOKEN" } -ContentType 'application/json' `
                -Body (@{ installId = $installId } | ConvertTo-Json -Compress)
              $matched = ($r.Content | ConvertFrom-Json).matched
              "QA install flag ($name): $($r.StatusCode) matched=$matched"
              if ($r.StatusCode -ne 200 -or $matched -ne $true) { "QA install flag ($name): the app's install row was not flagged"; $failed++ }
            } catch { "QA install flag ($name) failed: $($_.Exception.Message)"; $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-walkthrough
          path: ${{ runner.temp }}/shots
          retention-days: 14

      - name: Upload the desktop recording
        if: always() && inputs.desktop_recording
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-desktop-recording
          path: ${{ runner.temp }}/desktop-recording
          if-no-files-found: ignore
          retention-days: 14

      # Fresh website media from the same installed build: real screenshots and window recordings.
      - name: Record website media (Mac)
        id: media
        if: always() && matrix.label == 'mac' && env.UNVIBE_EXE != ''
        continue-on-error: true
        shell: bash
        env:
          MEDIA_DIR: ${{ runner.temp }}/media
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          # A fresh install per run: one reused id spends its 50 free explanations and then every
          # capture shows the limit instead of an answer. The next step flags it as QA.
          MEDIA_INSTALL_ID: qa-media-${{ github.run_id }}-${{ github.run_attempt }}
          MEDIA_SAMPLES: ${{ inputs.media_samples && '1' || '' }}
          MEDIA_ONLY: ${{ inputs.samples_only }}
          TWO_APP: ${{ inputs.two_app_take }}
        run: |
          if [ -n "$MEDIA_ONLY" ] && ! [[ "$MEDIA_ONLY" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then echo "samples_only must be file names separated by commas"; exit 1; fi
          if [ -n "$TWO_APP" ] && [ "$TWO_APP" != dry ] && [ "$TWO_APP" != take ]; then echo "two_app_take must be dry or take"; exit 1; fi
          if [ -n "$TWO_APP" ] && [ -n "$MEDIA_ONLY" ]; then echo "two_app_take and samples_only are separate runs"; exit 1; fi
          cp app/e2e/marketing-media.mjs app/e2e/two-app-take.mjs app/e2e/media-window.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          cp -R app/e2e/media-samples "$RUNNER_TEMP/pw/"
          if [ -n "$TWO_APP" ]; then
            swiftc -O -o "$RUNNER_TEMP/pw/mouse" app/e2e/mouse.swift
            cd "$RUNNER_TEMP/pw" && MOUSE="$RUNNER_TEMP/pw/mouse" node two-app-take.mjs
          else
            cd "$RUNNER_TEMP/pw" && node marketing-media.mjs
          fi

      - name: Flag the media install as QA (Mac)
        if: always() && matrix.label == 'mac' && env.UNVIBE_EXE != ''
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
          MEDIA_INSTALL_ID: qa-media-${{ github.run_id }}-${{ github.run_attempt }}
          MEDIA_OUTCOME: ${{ steps.media.outcome }}
        run: |
          if [ -z "$UNVIBE_QA_FLAG_TOKEN" ]; then echo 'QA install flag (media): no token, so this install counts as real'; exit 1; fi
          # The header goes in on stdin (printf is a shell builtin), so the token is never in a process's arguments.
          answer=$(printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -w '\n%{http_code}' \
            -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' \
            --data "{\"installId\":\"$MEDIA_INSTALL_ID\"}") || answer=$'\ncurl failed'
          code=$(printf '%s' "$answer" | tail -n 1)
          matched=$(printf '%s' "$answer" | head -n 1 | grep -o '"matched":[a-z]*' | cut -d: -f2)
          echo "QA install flag (media): $code matched=${matched:-none}"
          if [ "$code" = 200 ] && [ "$matched" = true ]; then exit 0; fi
          # A capture that failed before the app reached the API leaves nothing to flag; the media step already shows that.
          if [ "$MEDIA_OUTCOME" != success ]; then echo "QA install flag (media): no match after a media step that ended '$MEDIA_OUTCOME'"; exit 0; fi
          echo "QA install flag (media): the app's install row was not flagged"; exit 1

      - name: Upload website media
        if: always() && matrix.label == 'mac'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-mac-website-media
          path: ${{ runner.temp }}/media
          if-no-files-found: ignore
          retention-days: 14
