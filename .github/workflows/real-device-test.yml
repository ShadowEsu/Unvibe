name: Real device test

# Installs Unvibe on real macOS and Windows machines (a published release, or the artifacts of a
# build-only "Desktop app release" run so a change is proven before it ships), walks through setup,
# Google sign-in (up to Google's own page), every page and the global shortcut, and uploads a
# screenshot of every step plus a pass/fail report.
# The ai input (default false) decides whether anything is sent for a hosted explanation. With ai=false (every routine
# run) the walk makes no hosted-AI call: real-device.mjs gets QA_AI_OK=0, skips setup's sample and own code and the
# editor-bridge explanation, only checks that the global shortcut pops the send agreement up (on a profile without
# one), and refuses any step that would send; the Mac website media steps (marketing-media.mjs, about $0.09 of
# explanations on their own) are skipped. With ai=true (Unvibe 0.1.53 or later only): the timed first explanation,
# one pasted own code, the editor shortcut path and the global shortcut explain for real (4 hosted explanations per
# system), plus the Mac website media.
# rc0154=walk (with build_run, ai off) adds the Unvibe 0.1.54 RC rows (app/e2e/rc-0154.mjs), still with no hosted-AI
# call: Unvibe 0.1.52 is installed first and sets up a profile, the RC is installed over it, and after the usual walk
# the RC rows run (the upgraded profile, then the Island and overlay drags with the real pointer, density, the ⌘U
# hint, the palette, Share, the sign-in code and the setup sizes on a new profile).
# rc0154=ai-<mac|windows>-<full|short> (with build_run and ai=true) runs the RC rows that need hosted AI
# (app/e2e/rc-0154-ai.mjs) on that one system only, instead of the usual walk: at most 6 hosted calls (full) or 3
# (short), counted by the script, which refuses any past the plan. The usual walk (4 calls with ai=true), the website
# media and the portable exe are skipped, and no 0.1.52 is installed first. rc0154=ai-windows-row2 (BOSS's narrow
# re-check after Run B) is 1 hosted call: the ⌃U explanation, then only the finished-overlay drag (row 2).
# rc0154=hero (Mac only, ai off, a published version) shoots the site hero's Today still (app/e2e/hero-today.mjs:
# light, 1180x780 at 2x, sample lessons written into a new profile, sharks off) instead of the usual walk; no hosted-AI
# call, and no 0.1.52 is installed first.
# rc0155=walk (with build_run, ai off) is the 0.1.55 RC walk, with no hosted-AI call: Unvibe 0.1.54 is installed first
# (digest-pinned), sets up profile U and runs the sign-in control of app/e2e/rc-0155.mjs (RC_PHASE=control); the RC
# goes over it; after the usual walk come 0.1.54's RC rows (app/e2e/rc-0154.mjs) and then the 0.1.55 rows (#354: the
# sign-in card's code is dropped when the card closes, and on the Mac when ⌘W closes the window). Polls are counted in
# the app's Chromium net log (app/e2e/netlog.mjs): only time, method, path and status of api.unvibe.site's requests
# are kept; the raw log stays outside every uploaded folder and is deleted. The RC's app.asar is checked: on the Mac
# against Security's pin, on Windows the setup's against the installed one.
# rc0155=ai-<mac|windows> (with build_run and ai=true) runs app/e2e/rc-0155-ai.mjs on that one system only, instead of
# the usual walk: at most 3 hosted calls (BOSS), counted by the script (#353 Explain and Retry each pressed twice, #358
# a table answer at 320 px). For the Retry row api.unvibe.site points at the runner in the hosts file for a moment;
# an always() step removes that line again. The usual walk, the website media and the portable exe are skipped.
# rc0155=link (with build_run, ai off; Windows only) probes the unvibe:// link with no hosted-AI call
# (app/e2e/rc-0155-link.mjs; Run A Windows 44658289654 saw no overlay for it): Unvibe 0.1.54 is installed first
# (digest-pinned) and probed, then the RC goes over it and is probed: each build, the link from a process without and
# with UNVIBE_USER_DATA, with Unvibe.exe counts before and after. The app's default profile is seeded with a pre-flagged
# qa- id first, in case a second Unvibe starts on it. The usual walk and the portable exe are skipped.
# rc0157=setup (with build_run, ai off; Mac and Windows) runs the 0.1.57 setup's real-device rows that need no hosted AI
# (app/e2e/setup-0157.mjs, draft #372): 1:1 crops of the top bar's corners (Mac light and dark; Windows 100 % light and
# dark, and 150 % by Chromium's forced scale), the top row dragged and Back clicked with the real pointer, the Mac's
# ⌘U-then-⌃U on step 2 before any agreement (the panel asks for it), and step 3's Explain my clipboard on a fresh
# install (the agreement first) and with an empty clipboard. Nothing is explained: step 2's "Explain this code" and the
# confirm sheet's Explain are never pressed, and the net log is checked. The usual walk and the portable exe are skipped.
# d5=rows (with build_run, ai off; Mac and Windows) runs D5 #366's real-device rows for the Unvibe button with VS Code
# (app/e2e/d5-button.mjs): a real drag shows the button (mouse-up to button ms, placement, idle and click-away), the
# line-number gutter shows none (the I-beam check), no new macOS permission prompt with Unvibe's Accessibility reset,
# hover, press, stacking over a faded panel, the flip at the right edge, light and dark 1:1 crops, idle CPU on and off,
# Windows at Chromium's forced 150 %, VS Code's password prompt (N6) and Esc after the Quick look card. Nothing is
# explained: the first launches have no agreement (a press reads nothing), and the last runs with the API host blocked
# in the hosts file, put back byte for byte. VS Code: Homebrew's cask on the Mac; on Windows Microsoft's zip, sha256
# and Authenticode checked. The usual walk and the portable exe are skipped.
# d5=fade (with build_run, ai off; Mac only) runs only d5-button.mjs's launch F for #378, the Mac panel fade: a panel
# opened with ⌃U and never touched stays when you click into the editor in front (the lead's option 3); another app
# coming to the front fades it; touched (a header click), then VS Code clicked and activated, it fades; and with
# "Hide" as the click-away setting, a click on the panel itself keeps it on screen and leaving it hides it. It needs no
# Unvibe button, so it runs on a build without #366.
# d5=auto (with build_run, ai off; Mac and Windows) runs only d5-button.mjs's launch X for auto mode (#384, Security's
# C-3 rows) in VS Code and Cursor: a settled selection is read once (the control), select-then-paste and
# select-then-type at six moments land in the file, an image or a file copied in Finder/Explorer stays on the clipboard,
# at most one auto copy per 15 s (Windows: the Win+V history), and a double-click or an app switch during the read sends
# nothing. It runs with the API host blocked (no hosted call).
# d5=auto-defender (with build_run, ai off; Windows only) is Security's SHOULD-384c: Microsoft Defender back at its
# defaults (the runner image turns it off), the AMSI test sample as the control, then launch X's reads only (VS Code, at
# least 10 auto reads, the API host blocked), then nothing in Protection history or Defender/Operational for Unvibe or
# powershell.exe. Its own run: with Defender on under all of launch X, run 44982193648's Windows job passed 45 minutes.
# d5=auto-ai (with build_run, ai on; Mac and Windows) runs only launch Y: one settled selection explained with no
# press (VS Code on the Mac, Cursor on Windows), auto mode turned off as soon as it starts: at most one hosted call per
# system, and the answer's Suggested fixes (#383). Cursor: the user setup from Cursor's update service, its signature
# checked (Mac: codesign and its bundle id; Windows: Authenticode); it is not signed in.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to test, without the v (empty = latest on unvibe.site)"
        required: false
        default: ""
      build_run:
        description: "Optional: id of a build-only Desktop app release run to test instead of a release"
        required: false
        default: ""
      ai:
        description: "Explain for real (hosted AI: 4 explanations per system, plus the Mac website media; needs Unvibe 0.1.53+, an older build is refused before sending). Off: walk only, no hosted-AI call"
        type: boolean
        required: false
        default: false
      media_samples:
        description: "Also record marketing's sample files (app/e2e/media-samples/) in the website media (needs ai)"
        type: boolean
        required: false
        default: false
      desktop_recording:
        description: "Also record the whole screen around the global-shortcut step (demo video; Mac .mov, Windows JPEG frames)"
        type: boolean
        required: false
        default: false
      rc0154:
        description: "Unvibe 0.1.54 RC rows: 'walk' installs 0.1.52 first, then the build_run's RC over it, and runs app/e2e/rc-0154.mjs with no hosted-AI call (needs build_run and ai off). 'ai-mac-full', 'ai-mac-short', 'ai-windows-full' or 'ai-windows-short' runs app/e2e/rc-0154-ai.mjs on that system only, at most 6 (full) or 3 (short) hosted calls (needs build_run and ai on); 'ai-windows-row2' is 1 call, then only the finished-overlay drag. 'hero': the site hero's Today still on the Mac (needs version, no build_run, ai off). Empty: off"
        required: false
        default: ""
      rc0155:
        description: "Unvibe 0.1.55 RC rows: 'walk' installs 0.1.54 first, then the build_run's RC over it, and runs the usual walk, app/e2e/rc-0154.mjs and app/e2e/rc-0155.mjs with no hosted-AI call (needs build_run, ai off, rc0154 empty). 'ai-mac' or 'ai-windows' runs app/e2e/rc-0155-ai.mjs on that system only, at most 3 hosted calls (needs build_run, ai on, rc0154 empty). 'link' probes the unvibe:// link on 0.1.54 and the RC on Windows, no hosted-AI call (needs build_run, ai off). Empty: off"
        required: false
        default: ""
      rc0157:
        description: "Unvibe 0.1.57 setup rows: 'setup' runs app/e2e/setup-0157.mjs on the Mac and Windows with no hosted-AI call (the top bar's corners 1:1, drag and Back with the real pointer, Explain my clipboard on a fresh install and with an empty clipboard; needs build_run, ai off, rc0154 and rc0155 empty). Empty: off"
        required: false
        default: ""
      d5:
        description: "D5 rows: 'rows' runs app/e2e/d5-button.mjs (#366 button rows) with VS Code on the Mac and Windows; 'fade' runs only its launch F (#378 panel fade) on the Mac; 'auto' runs its launch X (#384 auto mode, VS Code and Cursor) on both with no hosted-AI call (needs ai off); 'auto-defender' runs launch X's reads on Windows with Microsoft Defender at its defaults (SHOULD-384c, ai off); 'auto-ai' runs its launch Y, at most 1 hosted call per system (needs ai on). All need build_run, rc0154, rc0155 and rc0157 empty. Empty: off"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# The only switch for hosted explanations. Anything but a dispatch with ai=true leaves it at 0.
env:
  QA_AI_OK: ${{ inputs.ai && '1' || '0' }}

jobs:
  walkthrough:
    strategy:
      fail-fast: false
      matrix:
        # rc0154=ai-<os>-<plan> and rc0155=ai-<os> run on that one system: their hosted calls are planned per system.
        include: ${{ fromJSON((startsWith(inputs.rc0154, 'ai-mac-') || inputs.rc0154 == 'hero' || inputs.rc0155 == 'ai-mac' || inputs.d5 == 'fade') && '[{"os":"macos-latest","label":"mac"}]' || (startsWith(inputs.rc0154, 'ai-windows-') || inputs.rc0155 == 'ai-windows' || inputs.rc0155 == 'link' || inputs.d5 == 'auto-defender') && '[{"os":"windows-latest","label":"windows"}]' || '[{"os":"macos-latest","label":"mac"},{"os":"windows-latest","label":"windows"}]') }}
    runs-on: ${{ matrix.os }}
    # rc0155=walk adds the last release first and two sets of RC rows to the usual walk.
    timeout-minutes: ${{ (inputs.rc0155 == 'walk' || inputs.d5 == 'auto' || inputs.d5 == 'auto-defender') && 45 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Say which mode runs
        shell: bash
        env:
          MEDIA_SAMPLES: ${{ inputs.media_samples && '1' || '' }}
          RC0154: ${{ inputs.rc0154 }}
          RC0155: ${{ inputs.rc0155 }}
          RC0157: ${{ inputs.rc0157 }}
          D5: ${{ inputs.d5 }}
          BUILD_RUN: ${{ inputs.build_run }}
          VERSION: ${{ inputs.version }}
          OS_LABEL: ${{ matrix.label }}
        run: |
          case "$RC0154$RC0155$RC0157$D5" in
            ai-*|hero|setup|rows|fade|auto|auto-defender|auto-ai) ;;
            *)
              if [ "$QA_AI_OK" = 1 ]; then
                echo "Mode: ai=true: the walkthrough explains for real (4 hosted calls on this system); the Mac also records the website media"
              else
                echo "Mode: ai=false: walk only, no hosted-AI call; the website media steps are skipped"
                if [ -n "$MEDIA_SAMPLES" ]; then echo "::warning::media_samples needs ai=true; with ai=false nothing is recorded"; fi
              fi ;;
          esac
          case "$RC0154" in
            '') ;;
            walk)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::rc0154=walk makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::rc0154=walk needs build_run (the RC's build-only run)"; exit 1; fi
              echo "RC rows: 0.1.52 first, the RC over it, then app/e2e/rc-0154.mjs (walk only, no hosted-AI call)" ;;
            ai-mac-full|ai-mac-short|ai-windows-full|ai-windows-short|ai-windows-row2)
              if [ "$QA_AI_OK" != 1 ]; then echo "::error::rc0154=$RC0154 sends hosted explanations: run it with ai on"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::rc0154=$RC0154 needs build_run (the RC's build-only run)"; exit 1; fi
              case "$RC0154" in ai-"$OS_LABEL"-*) ;; *) echo "::error::rc0154=$RC0154 is not for $OS_LABEL"; exit 1 ;; esac
              if [ -n "$MEDIA_SAMPLES" ]; then echo "::warning::media_samples is ignored with rc0154=$RC0154 (no website media)"; fi
              plan=${RC0154##*-}
              echo "Mode: RC rows with hosted AI on $OS_LABEL only, plan $plan (at most $(case $plan in (full) echo 6 ;; (short) echo 3 ;; (row2) echo 1 ;; esac) hosted calls, counted by app/e2e/rc-0154-ai.mjs). The usual walk, the website media and the portable exe are skipped" ;;
            hero)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::rc0154=hero makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -n "$BUILD_RUN" ] || [ -z "$VERSION" ]; then echo "::error::rc0154=hero shoots a published release: give version, not build_run"; exit 1; fi
              echo "Mode: the site hero's Today still on the Mac (app/e2e/hero-today.mjs), Unvibe $VERSION as published; no hosted-AI call. The usual walk and the website media are skipped" ;;
            *) echo "::error::rc0154 must be empty, walk, ai-mac-full, ai-mac-short, ai-windows-full, ai-windows-short, ai-windows-row2 or hero"; exit 1 ;;
          esac
          if [ -n "$RC0155" ] && [ -n "$RC0154" ]; then echo "::error::rc0154 and rc0155 can't run together: give one"; exit 1; fi
          case "$RC0155" in
            '') ;;
            walk)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::rc0155=walk makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::rc0155=walk needs build_run (the RC's build-only run)"; exit 1; fi
              echo "RC rows: 0.1.54 first (with the sign-in control), the RC over it, the usual walk, then app/e2e/rc-0154.mjs and app/e2e/rc-0155.mjs (walk only, no hosted-AI call)" ;;
            ai-mac|ai-windows)
              if [ "$QA_AI_OK" != 1 ]; then echo "::error::rc0155=$RC0155 sends hosted explanations: run it with ai on"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::rc0155=$RC0155 needs build_run (the RC's build-only run)"; exit 1; fi
              if [ "$RC0155" != "ai-$OS_LABEL" ]; then echo "::error::rc0155=$RC0155 is not for $OS_LABEL"; exit 1; fi
              if [ -n "$MEDIA_SAMPLES" ]; then echo "::warning::media_samples is ignored with rc0155=$RC0155 (no website media)"; fi
              echo "Mode: 0.1.55 RC rows with hosted AI on $OS_LABEL only (at most 3 hosted calls, counted by app/e2e/rc-0155-ai.mjs). The usual walk, the website media and the portable exe are skipped" ;;
            link)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::rc0155=link makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::rc0155=link needs build_run (the RC's build-only run)"; exit 1; fi
              if [ "$OS_LABEL" != windows ]; then echo "::error::rc0155=link is Windows only"; exit 1; fi
              echo "Mode: the unvibe:// link probe on Windows (app/e2e/rc-0155-link.mjs): 0.1.54 first, then the RC; no hosted-AI call. The usual walk and the portable exe are skipped" ;;
            *) echo "::error::rc0155 must be empty, walk, ai-mac, ai-windows or link"; exit 1 ;;
          esac
          if [ -n "$RC0157" ] && [ -n "$RC0154$RC0155" ]; then echo "::error::rc0157 can't run with rc0154 or rc0155: give one"; exit 1; fi
          case "$RC0157" in
            '') ;;
            setup)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::rc0157=setup makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::rc0157=setup needs build_run (the build-only run of the setup under test)"; exit 1; fi
              echo "Mode: the 0.1.57 setup rows (app/e2e/setup-0157.mjs) on $OS_LABEL; no hosted-AI call. The usual walk and the portable exe are skipped" ;;
            *) echo "::error::rc0157 must be empty or setup"; exit 1 ;;
          esac
          if [ -n "$D5" ] && [ -n "$RC0154$RC0155$RC0157" ]; then echo "::error::d5 can't run with rc0154, rc0155 or rc0157: give one"; exit 1; fi
          case "$D5" in
            '') ;;
            rows|fade)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::d5=$D5 makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::d5=$D5 needs build_run (the build-only run under test)"; exit 1; fi
              if [ "$D5" = fade ] && [ "$OS_LABEL" != mac ]; then echo "::error::d5=fade is Mac only"; exit 1; fi
              if [ "$D5" = rows ]; then echo "Mode: the D5 #366 button rows (app/e2e/d5-button.mjs) with VS Code on $OS_LABEL; no hosted-AI call (the last launch behind a hosts block of the API host). The usual walk and the portable exe are skipped"
              else echo "Mode: the #378 panel-fade rows (app/e2e/d5-button.mjs launch F only) with VS Code on the Mac; no hosted-AI call (no agreement in its profile). The usual walk and the portable exe are skipped"; fi ;;
            auto)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::d5=auto makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::d5=auto needs build_run (the build-only run under test)"; exit 1; fi
              echo "Mode: the #384 auto-mode rows (app/e2e/d5-button.mjs launch X) with VS Code and Cursor on $OS_LABEL; no hosted-AI call (the API host blocked in the hosts file). The usual walk, the website media and the portable exe are skipped" ;;
            auto-defender)
              if [ "$QA_AI_OK" = 1 ]; then echo "::error::d5=auto-defender makes no hosted-AI call: run it with ai off"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::d5=auto-defender needs build_run (the build-only run under test)"; exit 1; fi
              if [ "$OS_LABEL" != windows ]; then echo "::error::d5=auto-defender is Windows only"; exit 1; fi
              echo "Mode: Security's SHOULD-384c: Microsoft Defender at its defaults, then the #384 auto reads (app/e2e/d5-button.mjs launch X, VS Code only) on Windows, then Defender's logs; no hosted-AI call (the API host blocked in the hosts file). The usual walk, the website media and the portable exe are skipped" ;;
            auto-ai)
              if [ "$QA_AI_OK" != 1 ]; then echo "::error::d5=auto-ai sends one hosted explanation: run it with ai on"; exit 1; fi
              if [ -z "$BUILD_RUN" ]; then echo "::error::d5=auto-ai needs build_run (the build-only run under test)"; exit 1; fi
              if [ -n "$MEDIA_SAMPLES" ]; then echo "::warning::media_samples is ignored with d5=auto-ai (no website media)"; fi
              echo "Mode: the #384 auto-mode explanation with #383's Suggested fixes (app/e2e/d5-button.mjs launch Y) in $([ "$OS_LABEL" = mac ] && echo 'VS Code' || echo Cursor) on $OS_LABEL; at most 1 hosted call on this system. The usual walk, the website media and the portable exe are skipped" ;;
            *) echo "::error::d5 must be empty, rows, fade, auto, auto-defender or auto-ai"; exit 1 ;;
          esac

      # Every install this run makes must be flagged as QA, or it counts as a real install in the
      # funnel (29 Oct: a deleted secret made the flag steps skip and 12 CI installs counted as real).
      # So a missing token fails the run here, before anything is installed (BOSS 29 Oct).
      - name: Require the QA flag token
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
        run: |
          if [ -z "$UNVIBE_QA_FLAG_TOKEN" ]; then
            echo "::error::UNVIBE_QA_FLAG_TOKEN is not set, so this run's installs couldn't be flagged as QA. Nothing was installed."
            exit 1
          fi
          echo "QA flag token present"

      # Flag every install id this run will use before anything launches, so a run cancelled or timed
      # out mid-way still leaves only QA rows (run 42120662869 was cancelled before its after-run flag).
      # The route writes a flagged row for an id the API hasn't seen yet (matched false), and the app's
      # first contact keeps it (trialAccess readInstall upserts with ignoreDuplicates). The after-run
      # steps below still require matched true. Security file 2332, B-1..B-4.
      - name: Flag this run's install ids as QA before any launch
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
          WALK_INSTALL_ID: qa-walkthrough-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          MEDIA_INSTALL_ID: qa-media-${{ github.run_id }}-${{ github.run_attempt }}
          PORTABLE_INSTALL_ID: qa-portable-${{ github.run_id }}-${{ github.run_attempt }}
          RC_UPGRADE_ID: qa-rc0154-upgrade-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC_INSTALL_ID: qa-rc0154-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC_AI_ID: qa-rc0154-ai-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC_SAMPLE_ID: qa-rc0154-sample-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC_HERO_ID: qa-rc0154-hero-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC55_CONTROL_ID: qa-rc0155-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC55_ID: qa-rc0155-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC55_AI_ID: qa-rc0155-ai-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC55_LINK54_ID: qa-rc0155-link54-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC55_LINK_ID: qa-rc0155-link-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC55_LINK_DEFAULT_ID: qa-rc0155-link-default-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC0154: ${{ inputs.rc0154 }}
          RC0155: ${{ inputs.rc0155 }}
          RC0157: ${{ inputs.rc0157 }}
          SETUP57_ID: qa-setup0157-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          D5: ${{ inputs.d5 }}
          D5_ID: qa-d5-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          OS_LABEL: ${{ matrix.label }}
        run: |
          if [ -z "$UNVIBE_QA_FLAG_TOKEN" ]; then echo "::error::no QA flag token; nothing was launched"; exit 1; fi
          # The mode check above lets only one of rc0154, rc0155, rc0157 and d5 be set.
          case "$RC0154$RC0155$RC0157$D5" in
            # d5: only d5-button.mjs launches the app (one id for its profiles a, b (Windows), f, c, x and y).
            rows|fade|auto|auto-defender|auto-ai) ids="$D5_ID" ;;
            # rc0157 setup: only setup-0157.mjs launches the app (one id for its profiles: Mac one, Windows 100 % and 150 %).
            setup) ids="$SETUP57_ID" ;;
            # rc0155 ai: only rc-0155-ai.mjs launches the app (the walk, media and portable steps are skipped).
            ai-mac|ai-windows) ids="$RC55_AI_ID" ;;
            # rc0155 link: the probe's profiles on 0.1.54 and on the RC, and the default profile it seeds.
            link) ids="$RC55_LINK54_ID $RC55_LINK_ID $RC55_LINK_DEFAULT_ID" ;;
            # rc0154 ai: only rc-0154-ai.mjs launches the app (the walk, media and portable steps are skipped): its
            # profile, and with the full plan the sample's new profile.
            ai-*-full) ids="$RC_AI_ID $RC_SAMPLE_ID" ;;
            ai-*) ids="$RC_AI_ID" ;;
            # rc0154 hero: only hero-today.mjs launches the app (the walk is skipped).
            hero) ids="$RC_HERO_ID" ;;
            *)
              ids="$WALK_INSTALL_ID"
              if [ "$OS_LABEL" = mac ]; then
                # The media install exists only when the website media runs (ai=true).
                if [ "$QA_AI_OK" = 1 ]; then ids="$ids $MEDIA_INSTALL_ID"; fi
              else ids="$ids $PORTABLE_INSTALL_ID"; fi
              # rc0154 or rc0155 walk: the profile the last release sets up (then opened by the RC) and the RC rows'
              # new profile; rc0155 adds the sign-in control's profile (on the last release) and its own on the RC.
              if [ "$RC0154" = walk ] || [ "$RC0155" = walk ]; then ids="$ids $RC_UPGRADE_ID $RC_INSTALL_ID"; fi
              if [ "$RC0155" = walk ]; then ids="$ids $RC55_CONTROL_ID $RC55_ID"; fi ;;
          esac
          for id in $ids; do
            # The header goes in on stdin (printf is a shell builtin), so the token is never in a process's arguments.
            answer=$(printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -m 30 -w '\n%{http_code}' \
              -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' \
              --data "{\"installId\":\"$id\"}") || { echo "::error::pre-flag $id: curl failed; nothing was launched"; exit 1; }
            code=$(printf '%s' "$answer" | tail -n 1)
            # || true: the runner's bash has -e -o pipefail, and a body without "matched" (a 401) must still reach the error below.
            matched=$(printf '%s' "$answer" | head -n 1 | grep -o '"matched":[a-z]*' | cut -d: -f2) || true
            echo "QA pre-flag $id: $code matched=${matched:-none}"
            if [ "$code" != 200 ] || { [ "$matched" != true ] && [ "$matched" != false ]; }; then
              echo "::error::pre-flag $id was not stored; nothing was launched"; exit 1
            fi
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Pick the version
        id: ver
        shell: bash
        # Dispatch inputs reach shells only through env, never pasted into a script, and are checked here.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_RUN: ${{ inputs.build_run }}
        run: |
          if [ -n "$INPUT_BUILD_RUN" ] && ! [[ "$INPUT_BUILD_RUN" =~ ^[0-9]+$ ]]; then echo "build_run must be a run id (digits only)"; exit 1; fi
          v="$INPUT_VERSION"
          # ?notrack=1: our own fetch, served the same script but left out of the install-script fetch count.
          if [ -z "$v" ]; then v=$(curl -fsSL "https://unvibe.site/install.sh?notrack=1" | sed -n 's/^TAG=".*:-v\([0-9.]*\)}"$/\1/p' | head -1); fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "version must look like 0.1.44"; exit 1; fi
          echo "Testing Unvibe $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Install Playwright (driver, Chromium and its ffmpeg)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.48.2 axe-core@4.12.1 >/dev/null
          # ffmpeg: marketing-media.mjs encodes its window recordings with it.
          npx playwright install chromium ffmpeg

      # The build run names its artifacts after its own runners (macos-latest, windows-latest), so the name comes from
      # the label, whatever image this run is on.
      - name: Get the build-only artifacts
        if: inputs.build_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unvibe-${{ matrix.label == 'mac' && 'macos-latest' || 'windows-latest' }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build

      # rc0154=walk: the RC goes over the last release, as people get it. Unvibe 0.1.52 (0.1.53 was never released) is
      # installed first and sets up profile U (rc-0154.mjs RC_PHASE=pre: a name, setup skipped, dark theme; nothing is
      # explained), and is quit; the install step after it puts the RC over it. A failure here doesn't stop the RC rows:
      # report-pre.txt shows it and the walk notes that profile U is missing.
      - name: Install Unvibe 0.1.52 first and set up a profile (rc0154, Mac)
        if: inputs.rc0154 == 'walk' && matrix.label == 'mac'
        continue-on-error: true
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/rc0154
          UNVIBE_OS: mac
          RC_PHASE: pre
          RC_PROFILE_UPGRADE: ${{ runner.temp }}/rc0154-upgrade-profile
          RC_UPGRADE_ID: qa-rc0154-upgrade-${{ github.run_id }}-${{ github.run_attempt }}-mac
        run: |
          arch=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x64)
          curl -fL -o "$RUNNER_TEMP/Unvibe-0.1.52.dmg" "https://github.com/ShadowEsu/Unvibe/releases/download/v0.1.52/Unvibe-0.1.52-mac-$arch.dmg"
          # The release's own digests (GitHub's asset digest for v0.1.52); anything else is not run.
          if [ "$arch" = arm64 ]; then want=1305bec3076d4609407f3ed4b993e98edd1b9ce42f76ea5007de337d7022129a; else want=a5fea7150ff7e6ac48a40faba5f791cf91e3914b80e4d297f16689d7c70f307c; fi
          got=$(shasum -a 256 "$RUNNER_TEMP/Unvibe-0.1.52.dmg" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then echo "::error::Unvibe-0.1.52-mac-$arch.dmg sha256 $got, expected $want; not installed"; exit 1; fi
          echo "0.1.52 dmg sha256 $got (matches the release)"
          mnt="$RUNNER_TEMP/mnt-0152"; mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/Unvibe-0.1.52.dmg"
          ditto "$mnt/Unvibe.app" /Applications/Unvibe.app
          hdiutil detach "$mnt" -force || true
          xattr -cr /Applications/Unvibe.app
          echo "installed Unvibe $(defaults read /Applications/Unvibe.app/Contents/Info CFBundleShortVersionString)"
          cp app/e2e/rc-0154.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          status=0
          (cd "$RUNNER_TEMP/pw" && UNVIBE_EXE=/Applications/Unvibe.app/Contents/MacOS/Unvibe node rc-0154.mjs) || status=$?
          pkill -x Unvibe || true
          cat "$SHOTS_DIR/report-pre.txt" || true
          exit $status

      - name: Install Unvibe 0.1.52 first and set up a profile (rc0154, Windows)
        if: inputs.rc0154 == 'walk' && matrix.label == 'windows'
        continue-on-error: true
        shell: pwsh
        env:
          SHOTS_DIR: ${{ runner.temp }}/rc0154
          UNVIBE_OS: windows
          RC_PHASE: pre
          RC_PROFILE_UPGRADE: ${{ runner.temp }}/rc0154-upgrade-profile
          RC_UPGRADE_ID: qa-rc0154-upgrade-${{ github.run_id }}-${{ github.run_attempt }}-windows
        run: |
          $setup = "$env:RUNNER_TEMP\Unvibe-0.1.52-setup.exe"
          Invoke-WebRequest -Uri 'https://github.com/ShadowEsu/Unvibe/releases/download/v0.1.52/Unvibe-0.1.52-win-x64-setup.exe' -OutFile $setup
          # The release's own digest (GitHub's asset digest for v0.1.52); anything else is not run.
          $got = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($got -ne 'e8db1ed52209f069d8891d6d0167c61cfe6a45986022ffff8792ae0b3dafb9e9') { Write-Error "Unvibe-0.1.52-win-x64-setup.exe sha256 $got does not match the release; not run"; exit 1 }
          "0.1.52 setup sha256 $got (matches the release)"
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          "0.1.52 setup exit code: $($proc.ExitCode)"
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'Unvibe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) { Write-Error 'Unvibe 0.1.52 was not installed'; exit 1 }
          "installed Unvibe $($exe.VersionInfo.ProductVersion) at $($exe.FullName)"
          Copy-Item app/e2e/rc-0154.mjs, app/e2e/cdp-launch.mjs "$env:RUNNER_TEMP\pw\"
          $env:UNVIBE_EXE = $exe.FullName
          Push-Location "$env:RUNNER_TEMP\pw"
          node rc-0154.mjs
          $code = $LASTEXITCODE
          Pop-Location
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:SHOTS_DIR\report-pre.txt" -ErrorAction SilentlyContinue
          exit $code

      # rc0155=walk: the RC goes over the last release, 0.1.54 (digest-pinned to the published files). It sets up
      # profile U (rc-0154.mjs RC_PHASE=pre: a name, setup skipped, dark theme; nothing is explained), then runs the
      # sign-in control (rc-0155.mjs RC_PHASE=control: 0.1.54 polls on after the card closes, which proves the net log
      # sees the polls), and is quit; the install step after it puts the RC over it. A failure here doesn't stop the RC
      # rows: report-pre.txt and report-control.txt show it. The raw net log goes to $RUNNER_TEMP/netlog (never uploaded).
      - name: Install Unvibe 0.1.54 first, set up a profile and run the sign-in control (rc0155, Mac)
        if: inputs.rc0155 == 'walk' && matrix.label == 'mac'
        continue-on-error: true
        shell: bash
        env:
          UNVIBE_OS: mac
          RC_PROFILE_UPGRADE: ${{ runner.temp }}/rc0154-upgrade-profile
          RC_UPGRADE_ID: qa-rc0154-upgrade-${{ github.run_id }}-${{ github.run_attempt }}-mac
          RC55_PROFILE: ${{ runner.temp }}/rc0155-control-profile
          RC55_INSTALL_ID: qa-rc0155-control-${{ github.run_id }}-${{ github.run_attempt }}-mac
          NETLOG_DIR: ${{ runner.temp }}/netlog
        run: |
          arch=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x64)
          curl -fL -o "$RUNNER_TEMP/Unvibe-0.1.54.dmg" "https://github.com/ShadowEsu/Unvibe/releases/download/v0.1.54/Unvibe-0.1.54-mac-$arch.dmg"
          # The release's own digests (SHA256SUMS-mac.txt of v0.1.54); anything else is not run.
          if [ "$arch" = arm64 ]; then want=fd9b7e58a9d0257ed3c1e761e60cbcc110a7f2ae3c0bab5fc57bf1bc0c19ddc9; else want=b02c635c92470d70ee95a99a36e7b4fcbd94d37faab8a4b0896740227303ccb3; fi
          got=$(shasum -a 256 "$RUNNER_TEMP/Unvibe-0.1.54.dmg" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then echo "::error::Unvibe-0.1.54-mac-$arch.dmg sha256 $got, expected $want; not installed"; exit 1; fi
          echo "0.1.54 dmg sha256 $got (matches the release)"
          mnt="$RUNNER_TEMP/mnt-0154"; mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/Unvibe-0.1.54.dmg"
          ditto "$mnt/Unvibe.app" /Applications/Unvibe.app
          hdiutil detach "$mnt" -force || true
          xattr -cr /Applications/Unvibe.app
          echo "installed Unvibe $(defaults read /Applications/Unvibe.app/Contents/Info CFBundleShortVersionString)"
          # The control's ⌘W is a System Events key press: Accessibility for the helpers, as the install step below does.
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          for c in com.unvibe.app com.apple.systemevents com.apple.Terminal; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES('kTCCServiceAccessibility','$c',0,2,4,1,'UNUSED',0);" || true
          done
          for p in /bin/bash /usr/bin/osascript "$(command -v node)" /usr/local/opt/runner/provisioner/provisioner; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES('kTCCServiceAccessibility','$p',1,2,4,1,'UNUSED',0);" || true
          done
          cp app/e2e/rc-0154.mjs app/e2e/rc-0155.mjs app/e2e/netlog.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          export UNVIBE_EXE=/Applications/Unvibe.app/Contents/MacOS/Unvibe
          status=0
          (cd "$RUNNER_TEMP/pw" && SHOTS_DIR="$RUNNER_TEMP/rc0154" RC_PHASE=pre node rc-0154.mjs) || status=$?
          pkill -x Unvibe || true
          cat "$RUNNER_TEMP/rc0154/report-pre.txt" || true
          (cd "$RUNNER_TEMP/pw" && SHOTS_DIR="$RUNNER_TEMP/rc0155" RC_PHASE=control node rc-0155.mjs) || status=$?
          pkill -x Unvibe || true
          cat "$RUNNER_TEMP/rc0155/report-control.txt" || true
          exit $status

      - name: Install Unvibe 0.1.54 first, set up a profile and run the sign-in control (rc0155, Windows)
        if: inputs.rc0155 == 'walk' && matrix.label == 'windows'
        continue-on-error: true
        shell: pwsh
        env:
          UNVIBE_OS: windows
          RC_PROFILE_UPGRADE: ${{ runner.temp }}/rc0154-upgrade-profile
          RC_UPGRADE_ID: qa-rc0154-upgrade-${{ github.run_id }}-${{ github.run_attempt }}-windows
          RC55_PROFILE: ${{ runner.temp }}/rc0155-control-profile
          RC55_INSTALL_ID: qa-rc0155-control-${{ github.run_id }}-${{ github.run_attempt }}-windows
          NETLOG_DIR: ${{ runner.temp }}/netlog
        run: |
          $setup = "$env:RUNNER_TEMP\Unvibe-0.1.54-setup.exe"
          Invoke-WebRequest -Uri 'https://github.com/ShadowEsu/Unvibe/releases/download/v0.1.54/Unvibe-0.1.54-win-x64-setup.exe' -OutFile $setup
          # The release's own digest (SHA256SUMS-windows.txt of v0.1.54); anything else is not run.
          $got = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($got -ne '8f1bbd07eb6b393fc6a0123d504611511fc47fba6029685c848810e06b6eb05b') { Write-Error "Unvibe-0.1.54-win-x64-setup.exe sha256 $got does not match the release; not run"; exit 1 }
          "0.1.54 setup sha256 $got (matches the release)"
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          "0.1.54 setup exit code: $($proc.ExitCode)"
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'Unvibe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) { Write-Error 'Unvibe 0.1.54 was not installed'; exit 1 }
          "installed Unvibe $($exe.VersionInfo.ProductVersion) at $($exe.FullName)"
          Copy-Item app/e2e/rc-0154.mjs, app/e2e/rc-0155.mjs, app/e2e/netlog.mjs, app/e2e/cdp-launch.mjs "$env:RUNNER_TEMP\pw\"
          $env:UNVIBE_EXE = $exe.FullName
          $code = 0
          Push-Location "$env:RUNNER_TEMP\pw"
          $env:SHOTS_DIR = "$env:RUNNER_TEMP\rc0154"; $env:RC_PHASE = 'pre'
          node rc-0154.mjs
          if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:RUNNER_TEMP\rc0154\report-pre.txt" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $env:SHOTS_DIR = "$env:RUNNER_TEMP\rc0155"; $env:RC_PHASE = 'control'
          node rc-0155.mjs
          if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
          Pop-Location
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:RUNNER_TEMP\rc0155\report-control.txt" -ErrorAction SilentlyContinue
          exit $code

      # rc0155=link: Unvibe 0.1.54 (the release's own digest) and the link probe on it, before the RC goes over it. The
      # default profile (%APPDATA%\Unvibe) gets a pre-flagged qa- id first, so a second Unvibe that starts there is QA.
      - name: Install Unvibe 0.1.54 first and probe the unvibe:// link (rc0155 link, Windows)
        if: inputs.rc0155 == 'link' && matrix.label == 'windows'
        continue-on-error: true
        shell: pwsh
        env:
          UNVIBE_OS: windows
          RC_PHASE: release
          RC55_LINK_PROFILE: ${{ runner.temp }}/rc0155-link54-profile
          RC55_LINK_ID: qa-rc0155-link54-${{ github.run_id }}-${{ github.run_attempt }}-windows
          RC55_LINK_DEFAULT_ID: qa-rc0155-link-default-${{ github.run_id }}-${{ github.run_attempt }}-windows
          NETLOG_DIR: ${{ runner.temp }}/netlog
        run: |
          $def = Join-Path $env:APPDATA 'Unvibe'
          if (Test-Path (Join-Path $def 'unvibe-store.json')) { "default profile already holds a store, install id $((Get-Content (Join-Path $def 'unvibe-store.json') -Raw | ConvertFrom-Json -AsHashtable)['installId'])" }
          else {
            New-Item -ItemType Directory -Force $def | Out-Null
            Set-Content -Path (Join-Path $def 'unvibe-store.json') -Value (@{ installId = $env:RC55_LINK_DEFAULT_ID; loginPromptAsked = $true } | ConvertTo-Json -Compress) -Encoding utf8NoBOM
            "default profile $def seeded with $env:RC55_LINK_DEFAULT_ID"
          }
          $setup = "$env:RUNNER_TEMP\Unvibe-0.1.54-setup.exe"
          Invoke-WebRequest -Uri 'https://github.com/ShadowEsu/Unvibe/releases/download/v0.1.54/Unvibe-0.1.54-win-x64-setup.exe' -OutFile $setup
          # The release's own digest (SHA256SUMS-windows.txt of v0.1.54); anything else is not run.
          $got = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($got -ne '8f1bbd07eb6b393fc6a0123d504611511fc47fba6029685c848810e06b6eb05b') { Write-Error "Unvibe-0.1.54-win-x64-setup.exe sha256 $got does not match the release; not run"; exit 1 }
          "0.1.54 setup sha256 $got (matches the release)"
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          "0.1.54 setup exit code: $($proc.ExitCode)"
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'Unvibe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) { Write-Error 'Unvibe 0.1.54 was not installed'; exit 1 }
          "installed Unvibe $($exe.VersionInfo.ProductVersion) at $($exe.FullName)"
          Copy-Item app/e2e/rc-0155-link.mjs, app/e2e/netlog.mjs, app/e2e/cdp-launch.mjs "$env:RUNNER_TEMP\pw\"
          $env:UNVIBE_EXE = $exe.FullName
          $env:SHOTS_DIR = "$env:RUNNER_TEMP\rc0155"
          $env:DEFAULT_PROFILE = $def
          Push-Location "$env:RUNNER_TEMP\pw"
          node rc-0155-link.mjs
          $code = $LASTEXITCODE
          Pop-Location
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:RUNNER_TEMP\rc0155\report-link-release.txt" -ErrorAction SilentlyContinue
          exit $code

      - name: Install Unvibe (Mac)
        if: matrix.label == 'mac'
        shell: bash
        env:
          V: ${{ steps.ver.outputs.v }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          v="$V"
          arch=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x64)
          if [ -n "$BUILD_RUN" ]; then
            cp "$(ls "$RUNNER_TEMP"/build/*-mac-$arch.dmg | head -1)" "$RUNNER_TEMP/Unvibe.dmg"
          else
            curl -fL -o "$RUNNER_TEMP/Unvibe.dmg" "https://github.com/ShadowEsu/Unvibe/releases/download/v$v/Unvibe-$v-mac-$arch.dmg"
          fi
          mnt="$RUNNER_TEMP/mnt"; mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/Unvibe.dmg"
          # Replace the whole app, as Finder does (with rc0154, 0.1.52 is there first): nothing of it is merged in.
          rm -rf /Applications/Unvibe.app
          ditto "$mnt/Unvibe.app" /Applications/Unvibe.app
          hdiutil detach "$mnt" -force || true
          xattr -cr /Applications/Unvibe.app
          codesign --verify --deep --strict /Applications/Unvibe.app && echo "signature valid"
          # Let Unvibe and the test's keystroke helpers use Accessibility, like a user switching it on.
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          for c in com.unvibe.app com.apple.systemevents com.apple.Terminal; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES('kTCCServiceAccessibility','$c',0,2,4,1,'UNUSED',0);" || true
          done
          for p in /bin/bash /usr/bin/osascript "$(command -v node)" /usr/local/opt/runner/provisioner/provisioner; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES('kTCCServiceAccessibility','$p',1,2,4,1,'UNUSED',0);" || true
          done
          echo "UNVIBE_EXE=/Applications/Unvibe.app/Contents/MacOS/Unvibe" >> "$GITHUB_ENV"

      - name: Install Unvibe (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.v }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          $v = $env:V
          $setup = "$env:RUNNER_TEMP\Unvibe-setup.exe"
          if ($env:BUILD_RUN) {
            Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\build" -Filter '*-win-x64-setup.exe' | Select-Object -First 1).FullName $setup
          } else {
            Invoke-WebRequest -Uri "https://github.com/ShadowEsu/Unvibe/releases/download/v$v/Unvibe-$v-win-x64-setup.exe" -OutFile $setup
          }
          $item = Get-Item $setup
          "setup: $($item.Length) bytes, sha256 $((Get-FileHash $setup -Algorithm SHA256).Hash)"
          $motw = Get-Content $setup -Stream Zone.Identifier -ErrorAction SilentlyContinue
          "zone identifier: $(if ($motw) { $motw -join ' ' } else { 'none' })"
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          "setup exit code: $($proc.ExitCode)"
          # The NSIS installer can hand off to a child process; give the files a moment to land.
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'Unvibe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name, LastWriteTime | Out-String | Write-Host
            Get-Process | Where-Object { $_.ProcessName -match 'Unvibe|setup|nsis' } | Format-Table ProcessName, Id | Out-String | Write-Host
            Write-Error 'Unvibe.exe was not installed'; exit 1
          }
          "UNVIBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # rc0155: the RC under test is the build Security read (requests/security/20261119-1640-…, run 44647459465).
      # Mac: the installed app.asar against Security's pin. Windows: the app.asar inside the setup that was run and the
      # installed one must be the same file; that value is the Windows pin for the 0.1.55 publish.
      - name: Check the RC's app.asar (rc0155, Mac)
        if: inputs.rc0155 != '' && env.UNVIBE_EXE != '' && matrix.label == 'mac'
        shell: bash
        run: |
          want=fbd2412cd255d9ac0698d5796f58b5843b4643c4e6c13ce29a2eaba27e263cfe
          got=$(shasum -a 256 /Applications/Unvibe.app/Contents/Resources/app.asar | cut -d' ' -f1)
          echo "installed app.asar sha256 $got"
          if [ "$got" != "$want" ]; then echo "::error::the installed app.asar is not Security's pin $want"; exit 1; fi
          echo "PASS  Mac app.asar = Security's pin"

      - name: Check the RC's app.asar (rc0155, Windows)
        if: inputs.rc0155 != '' && env.UNVIBE_EXE != '' && matrix.label == 'windows'
        shell: pwsh
        run: |
          # electron-builder's NSIS setup holds the app as $PLUGINSDIR\app-64.7z; app.asar is inside that (run 44653582285
          # read the setup's top level and found no app.asar).
          $dir = "$env:RUNNER_TEMP\asar-setup"
          New-Item -ItemType Directory -Force $dir | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' e -y "-o$dir" "$env:RUNNER_TEMP\Unvibe-setup.exe" '$PLUGINSDIR\app-64.7z' | Out-Null
          if (-not (Test-Path "$dir\app-64.7z")) { Write-Error 'no $PLUGINSDIR\app-64.7z inside the setup'; exit 1 }
          & 'C:\Program Files\7-Zip\7z.exe' e -y "-o$dir" "$dir\app-64.7z" 'resources\app.asar' | Out-Null
          if (-not (Test-Path "$dir\app.asar")) { Write-Error 'no resources\app.asar inside the setup''s app-64.7z'; exit 1 }
          $inner = (Get-FileHash "$dir\app.asar" -Algorithm SHA256).Hash.ToLower()
          $installed = (Get-FileHash (Join-Path (Split-Path $env:UNVIBE_EXE) 'resources\app.asar') -Algorithm SHA256).Hash.ToLower()
          "app.asar inside the setup sha256 $inner ($((Get-Item "$dir\app.asar").Length) bytes)"
          "installed app.asar sha256 $installed"
          if ($inner -ne $installed) { Write-Error "the installed app.asar is not the setup's"; exit 1 }
          "PASS  Windows app.asar: the setup's = the installed one = $inner"

      # Skipped with rc0154 ai and rc0155 ai: with ai=true it would send its own 4 explanations, outside the RC plan's
      # count. Skipped with rc0154 hero (that run only shoots the hero still), rc0155 link (the probe only), rc0157
      # setup (the setup rows only) and d5 rows (the button rows only).
      - name: Walk through the app
        if: ${{ !startsWith(inputs.rc0154, 'ai-') && inputs.rc0154 != 'hero' && !startsWith(inputs.rc0155, 'ai-') && inputs.rc0155 != 'link' && inputs.rc0157 == '' && inputs.d5 == '' }}
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
          UNVIBE_OS: ${{ matrix.label }}
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          UNVIBE_E2E_PROFILE: ${{ runner.temp }}/walkthrough-profile
          # Seeded into the profile, so this run's install is known and flagged as QA below.
          E2E_INSTALL_ID: qa-walkthrough-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          # Off unless asked for: the recording is for the demo video, not a check.
          DESKTOP_RECORDING: ${{ inputs.desktop_recording && '1' || '' }}
          DESKTOP_RECORDING_DIR: ${{ runner.temp }}/desktop-recording
        run: |
          cp app/e2e/real-device.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw" && node real-device.mjs
          cat "$SHOTS_DIR/report.txt"

      # rc0154=walk and rc0155=walk: the 0.1.54 RC rows (app/e2e/rc-0154.mjs), no hosted-AI call: profile U (the last
      # release's) opened by the RC, then a new profile. On the Mac, mouse.swift gives the real pointer the Island and
      # overlay drags need.
      - name: Walk the 0.1.54 RC rows (rc0154)
        if: always() && (inputs.rc0154 == 'walk' || inputs.rc0155 == 'walk') && env.UNVIBE_EXE != ''
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/rc0154
          UNVIBE_OS: ${{ matrix.label }}
          RC_PHASE: walk
          RC_PROFILE_UPGRADE: ${{ runner.temp }}/rc0154-upgrade-profile
          RC_PROFILE: ${{ runner.temp }}/rc0154-profile
          # Seeded into the new profile and pre-flagged above, like the walkthrough's.
          RC_INSTALL_ID: qa-rc0154-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
        run: |
          cp app/e2e/rc-0154.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          if [ "$UNVIBE_OS" = mac ]; then
            swiftc -O -o "$RUNNER_TEMP/pw/mouse" app/e2e/mouse.swift
            export MOUSE="$RUNNER_TEMP/pw/mouse"
          fi
          status=0
          (cd "$RUNNER_TEMP/pw" && node rc-0154.mjs) || status=$?
          cat "$SHOTS_DIR/report-walk.txt" || true
          exit $status

      # rc0154=hero: the site hero's Today still (unvibe-site, Design's Option A spec §3), no hosted-AI call: a new
      # profile holding sample lessons, light, sharks off, Today at 1180x780 captured at 2x (2360x1560 px, checked).
      - name: Shoot the site hero's Today still (rc0154 hero)
        if: inputs.rc0154 == 'hero' && env.UNVIBE_EXE != ''
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/rc0154
          UNVIBE_OS: ${{ matrix.label }}
          RC_HERO_PROFILE: ${{ runner.temp }}/rc0154-hero-profile
          # Seeded into the profile and pre-flagged above.
          RC_HERO_ID: qa-rc0154-hero-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
        run: |
          cp app/e2e/hero-today.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          status=0
          (cd "$RUNNER_TEMP/pw" && node hero-today.mjs) || status=$?
          cat "$SHOTS_DIR/report-hero.txt" || true
          exit $status

      # rc0154=ai-<os>-<plan>: the RC rows that need hosted AI (app/e2e/rc-0154-ai.mjs) on this one system: the ⌃U
      # explanation, the finished overlay's rows (Question it, chips, Design stills, density, the done-state drag, the
      # first press), the quiz check, Ask Vibe and, with full, setup's sample on a new profile; then row 14 again with
      # the fixed browser probe. Not always(): any failed step before it (the mode check, the install) means nothing
      # is sent. The script counts each call and refuses past the plan (full 6, short 3, row2 1: the ⌃U explanation and
      # the done-state drag only).
      - name: Run the 0.1.54 RC rows with hosted AI (rc0154 ai)
        if: startsWith(inputs.rc0154, 'ai-') && env.UNVIBE_EXE != '' && env.QA_AI_OK == '1'
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/rc0154
          UNVIBE_OS: ${{ matrix.label }}
          RC0154: ${{ inputs.rc0154 }}
          RC_AI_PROFILE: ${{ runner.temp }}/rc0154-ai-profile
          RC_SAMPLE_PROFILE: ${{ runner.temp }}/rc0154-sample-profile
          # Seeded into the profiles and pre-flagged above.
          RC_AI_ID: qa-rc0154-ai-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          RC_SAMPLE_ID: qa-rc0154-sample-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
        run: |
          export RC_AI_PLAN="${RC0154##*-}"
          cp app/e2e/rc-0154-ai.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          if [ "$UNVIBE_OS" = mac ]; then
            swiftc -O -o "$RUNNER_TEMP/pw/mouse" app/e2e/mouse.swift
            export MOUSE="$RUNNER_TEMP/pw/mouse"
          fi
          status=0
          (cd "$RUNNER_TEMP/pw" && node rc-0154-ai.mjs) || status=$?
          cat "$SHOTS_DIR/report-ai.txt" || true
          exit $status

      # rc0155=walk: the 0.1.55 RC rows (app/e2e/rc-0155.mjs, RC_PHASE=walk), no hosted-AI call: #354 on a new profile
      # (the sign-in card closes while its code waits; on the Mac a real ⌘W closes the window). The raw net log goes to
      # $RUNNER_TEMP/netlog, which nothing uploads; the script keeps only time, method, path and status and deletes it.
      - name: Walk the 0.1.55 RC rows (rc0155)
        if: always() && inputs.rc0155 == 'walk' && env.UNVIBE_EXE != ''
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/rc0155
          UNVIBE_OS: ${{ matrix.label }}
          RC_PHASE: walk
          RC55_PROFILE: ${{ runner.temp }}/rc0155-profile
          # Seeded into the new profile and pre-flagged above.
          RC55_INSTALL_ID: qa-rc0155-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          NETLOG_DIR: ${{ runner.temp }}/netlog
        run: |
          cp app/e2e/rc-0155.mjs app/e2e/netlog.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          status=0
          (cd "$RUNNER_TEMP/pw" && node rc-0155.mjs) || status=$?
          cat "$SHOTS_DIR/report-walk.txt" || true
          exit $status

      # rc0155=ai-<os>: the 0.1.55 RC rows that need hosted AI (app/e2e/rc-0155-ai.mjs) on this one system, at most 3
      # calls (BOSS), counted by the script: #353 Explain and Retry each pressed twice, #358 a table answer at 320 px.
      # Not always(): any failed step before it (the mode check, the install) means nothing is sent. The Retry row
      # points api.unvibe.site at this machine in the hosts file for a moment; the script removes the line, and so does
      # the always() step below.
      - name: Run the 0.1.55 RC rows with hosted AI (rc0155 ai)
        if: startsWith(inputs.rc0155, 'ai-') && env.UNVIBE_EXE != '' && env.QA_AI_OK == '1'
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/rc0155
          UNVIBE_OS: ${{ matrix.label }}
          RC55_AI_PROFILE: ${{ runner.temp }}/rc0155-ai-profile
          # Seeded into the profile and pre-flagged above.
          RC55_AI_ID: qa-rc0155-ai-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          NETLOG_DIR: ${{ runner.temp }}/netlog
          # Windows sends 2 calls, not 3: the #358 table ask is skipped (the server prompt forbids tables; Run A Mac
          # 44656303317 got none; the lead's option 3, requests/unvibe/20261119-1753-unvibe-qa-rc0155-358-table.md).
          RC55_SKIP_TABLE: ${{ inputs.rc0155 == 'ai-windows' && '1' || '' }}
        run: |
          cp app/e2e/rc-0155-ai.mjs app/e2e/netlog.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          status=0
          (cd "$RUNNER_TEMP/pw" && node rc-0155-ai.mjs) || status=$?
          cat "$SHOTS_DIR/report-ai.txt" || true
          exit $status

      # rc0155=link: the same probe on the RC (installed over 0.1.54 above), no hosted-AI call.
      - name: Probe the unvibe:// link on the RC (rc0155 link, Windows)
        if: always() && inputs.rc0155 == 'link' && env.UNVIBE_EXE != '' && matrix.label == 'windows'
        shell: pwsh
        env:
          UNVIBE_OS: windows
          RC_PHASE: rc
          SHOTS_DIR: ${{ runner.temp }}/rc0155
          RC55_LINK_PROFILE: ${{ runner.temp }}/rc0155-link-profile
          RC55_LINK_ID: qa-rc0155-link-${{ github.run_id }}-${{ github.run_attempt }}-windows
          NETLOG_DIR: ${{ runner.temp }}/netlog
        run: |
          Copy-Item app/e2e/rc-0155-link.mjs, app/e2e/netlog.mjs, app/e2e/cdp-launch.mjs "$env:RUNNER_TEMP\pw\"
          $env:DEFAULT_PROFILE = Join-Path $env:APPDATA 'Unvibe'
          Push-Location "$env:RUNNER_TEMP\pw"
          node rc-0155-link.mjs
          $code = $LASTEXITCODE
          Pop-Location
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:RUNNER_TEMP\rc0155\report-link-rc.txt" -ErrorAction SilentlyContinue
          exit $code

      # rc0157=setup: the 0.1.57 setup rows (app/e2e/setup-0157.mjs), no hosted-AI call. On the Mac, mouse.swift gives
      # the real pointer the drag and Back rows need. The raw net log stays in $RUNNER_TEMP/netlog-setup0157 (never
      # uploaded); the script keeps only time, method, path and status and deletes it, and this step deletes the folder.
      - name: Walk the 0.1.57 setup rows (rc0157 setup)
        if: inputs.rc0157 == 'setup' && env.UNVIBE_EXE != ''
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/setup0157
          UNVIBE_OS: ${{ matrix.label }}
          SETUP57_PROFILE: ${{ runner.temp }}/setup0157-profile
          # Seeded into each new profile and pre-flagged above.
          SETUP57_ID: qa-setup0157-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          NETLOG_DIR: ${{ runner.temp }}/netlog-setup0157
        run: |
          cp app/e2e/setup-0157.mjs app/e2e/netlog.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          if [ "$UNVIBE_OS" = mac ]; then
            swiftc -O -o "$RUNNER_TEMP/pw/mouse" app/e2e/mouse.swift
            export MOUSE="$RUNNER_TEMP/pw/mouse"
          fi
          status=0
          (cd "$RUNNER_TEMP/pw" && node setup-0157.mjs) || status=$?
          rm -rf "$NETLOG_DIR"
          cat "$SHOTS_DIR/report-setup0157-$UNVIBE_OS.txt" || true
          exit $status

      # d5 (every mode): VS Code for the D5 rows. Mac: Homebrew's cask, its quarantine flag removed (as the install step does
      # for Unvibe), signed by Microsoft's team UBF8T346G9. Windows: the stable zip from Microsoft's update service, its
      # sha256 the service's, and Code.exe Authenticode-signed by Microsoft. Nothing is installed system-wide on Windows.
      - name: Install VS Code for the D5 rows (Mac)
        if: inputs.d5 != '' && matrix.label == 'mac'
        shell: bash
        run: |
          brew install --cask visual-studio-code >/dev/null
          app="/Applications/Visual Studio Code.app"
          xattr -dr com.apple.quarantine "$app" || true
          if ! codesign --verify --deep --strict "$app"; then echo "::error::VS Code's signature does not verify"; exit 1; fi
          echo "VS Code signature valid"
          team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          echo "VS Code $(defaults read "$app/Contents/Info" CFBundleShortVersionString), team $team"
          if [ "$team" != UBF8T346G9 ]; then echo "::error::VS Code is not signed by Microsoft's team"; exit 1; fi
          echo "VSCODE=$app/Contents/Resources/app/bin/code" >> "$GITHUB_ENV"

      - name: Install VS Code for the D5 rows (Windows)
        if: inputs.d5 != '' && matrix.label == 'windows'
        shell: pwsh
        run: |
          $info = Invoke-RestMethod 'https://update.code.visualstudio.com/api/update/win32-x64-archive/stable/latest'
          "VS Code $($info.productVersion) ($($info.version)); the service's sha256 $($info.sha256hash); from $(([Uri]$info.url).Host)"
          if (([Uri]$info.url).Host -notmatch '(^|\.)(microsoft\.com|visualstudio\.com)$') { Write-Error 'the zip is not on a Microsoft host'; exit 1 }
          $zip = "$env:RUNNER_TEMP\vscode.zip"
          Invoke-WebRequest -Uri $info.url -OutFile $zip -UseBasicParsing
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $info.sha256hash.ToLower()) { Write-Error "the zip's sha256 $got is not the service's"; exit 1 }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vscode" -Force
          $exe = "$env:RUNNER_TEMP\vscode\Code.exe"
          $sig = Get-AuthenticodeSignature $exe
          "Code.exe: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { Write-Error 'Code.exe is not validly signed by Microsoft'; exit 1 }
          "VSCODE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # d5=auto (both systems) and auto-ai (Windows): Cursor, from Cursor's update service (its stable "latest" link
      # redirects to downloads.cursor.com). Mac: the dmg's app copied to /Applications, codesign verified, and its bundle
      # id the one Unvibe's auto mode allows (com.todesktop.230313mzl4w4u92). Windows: the per-user setup, Authenticode
      # valid on it and on Cursor.exe, installed silently without starting Cursor. Cursor is not signed in.
      - name: Install Cursor for the auto-mode rows (Mac)
        if: inputs.d5 == 'auto' && matrix.label == 'mac'
        shell: bash
        run: |
          dmg="$RUNNER_TEMP/cursor.dmg"
          final=$(curl -sSfL --retry 3 -o "$dmg" -w '%{url_effective}' 'https://api2.cursor.sh/updates/download/golden/darwin-arm64/cursor/latest')
          host=$(printf '%s' "$final" | sed -E 's#^https://([^/]+)/.*#\1#')
          echo "Cursor dmg from $host ($(du -h "$dmg" | cut -f1)), sha256 $(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          if [ "$host" != downloads.cursor.com ]; then echo "::error::the Cursor dmg did not come from downloads.cursor.com ($final)"; exit 1; fi
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's#^.*\(/Volumes/.*\)$#\1#p' | tail -1)
          src=$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$src" ]; then echo "::error::no app in the Cursor dmg"; exit 1; fi
          ditto "$src" /Applications/Cursor.app
          hdiutil detach "$mnt" -quiet || true
          app=/Applications/Cursor.app
          xattr -dr com.apple.quarantine "$app" || true
          if ! codesign --verify --deep --strict "$app"; then echo "::error::Cursor's signature does not verify"; exit 1; fi
          id=$(defaults read "$app/Contents/Info" CFBundleIdentifier)
          team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          echo "Cursor $(defaults read "$app/Contents/Info" CFBundleShortVersionString), $id, team $team, signature valid"
          if [ "$id" != com.todesktop.230313mzl4w4u92 ]; then echo "::error::Cursor's bundle id is $id, not the one Unvibe's auto mode allows"; exit 1; fi
          echo "CURSOR=$app/Contents/MacOS/$(defaults read "$app/Contents/Info" CFBundleExecutable)" >> "$GITHUB_ENV"

      - name: Install Cursor for the auto-mode rows (Windows)
        if: (inputs.d5 == 'auto' || inputs.d5 == 'auto-ai') && matrix.label == 'windows'
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\CursorUserSetup-x64.exe"
          $r = Invoke-WebRequest -Uri 'https://api2.cursor.sh/updates/download/golden/win32-x64-user/cursor/latest' -OutFile $setup -UseBasicParsing -PassThru
          $final = $r.BaseResponse.RequestMessage.RequestUri
          "Cursor setup from $($final.Host) ($([IO.Path]::GetFileName($final.AbsolutePath))), sha256 $((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())"
          if ($final.Host -ne 'downloads.cursor.com') { Write-Error "the Cursor setup did not come from downloads.cursor.com ($final)"; exit 1 }
          $sig = Get-AuthenticodeSignature $setup
          "setup: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "the Cursor setup's signature is $($sig.Status)"; exit 1 }
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/MERGETASKS=!runcode' -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Error 'the Cursor setup did not finish in 5 minutes'; exit 1 }
          "setup exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3
          Get-Process Cursor -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = "$env:LOCALAPPDATA\Programs\cursor\Cursor.exe"
          if (-not (Test-Path $exe)) { $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter Cursor.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $exe) { Write-Error 'Cursor.exe is not installed'; exit 1 }
          $sig = Get-AuthenticodeSignature $exe
          "$exe $((Get-Item $exe).VersionInfo.ProductVersion): $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Cursor.exe's signature is $($sig.Status)"; exit 1 }
          "CURSOR=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # d5=auto-defender (Windows), Security's SHOULD-384c: Microsoft Defender back at its defaults for the auto reads. The runner
      # image turns it off (actions/runner-images Configure-WindowsDefender.ps1: real-time, behaviour, IOAV, script
      # scanning, cloud and block at first sight off; C:\ and D:\ excluded). Each is set back one at a time, every
      # exclusion removed, the signatures updated, and the AMSI test sample run in powershell.exe as the control: it must
      # be blocked and logged, or a quiet log after the reads proves nothing. The check's window opens after the control.
      - name: Turn Microsoft Defender back on (d5=auto-defender, Windows)
        if: inputs.d5 == 'auto-defender' && matrix.label == 'windows'
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\d5"; New-Item -ItemType Directory -Force $out | Out-Null
          $rep = "$out\report-defender.txt"
          function Say([string]$s) { $s; Add-Content -Path $rep -Value $s -Encoding utf8 }
          $st = Get-MpComputerStatus; $p = Get-MpPreference
          Say "Defender as the image left it: mode $($st.AMRunningMode), real-time $($st.RealTimeProtectionEnabled), behaviour $($st.BehaviorMonitorEnabled), IOAV $($st.IoavProtectionEnabled), script scanning $(-not $p.DisableScriptScanning), cloud (MAPS) $($p.MAPSReporting), excluded paths: $(@($p.ExclusionPath | Where-Object { $_ }) -join ' ')"
          $prefs = [ordered]@{ DisableRealtimeMonitoring = $false; DisableBehaviorMonitoring = $false; DisableIOAVProtection = $false; DisableScriptScanning = $false; DisableArchiveScanning = $false; DisableBlockAtFirstSeen = $false; DisableIntrusionPreventionSystem = $false; DisableScanningNetworkFiles = $false; DisableAutoExclusions = $false; MAPSReporting = 2; SubmitSamplesConsent = 1 }
          foreach ($k in $prefs.Keys) { try { $a = @{ $k = $prefs[$k] }; Set-MpPreference @a -ErrorAction Stop } catch { Say "NOTE  Set-MpPreference -$k $($prefs[$k]): $($_.Exception.Message)" } }
          foreach ($x in @($p.ExclusionPath | Where-Object { $_ })) { Remove-MpPreference -ExclusionPath $x }
          foreach ($x in @($p.ExclusionProcess | Where-Object { $_ })) { Remove-MpPreference -ExclusionProcess $x }
          foreach ($x in @($p.ExclusionExtension | Where-Object { $_ })) { Remove-MpPreference -ExclusionExtension $x }
          try { Update-MpSignature -ErrorAction Stop } catch { Say "NOTE  Update-MpSignature: $($_.Exception.Message)" }
          Start-Sleep -Seconds 5
          $st = Get-MpComputerStatus; $p = Get-MpPreference
          $left = @($p.ExclusionPath | Where-Object { $_ }) + @($p.ExclusionProcess | Where-Object { $_ }) + @($p.ExclusionExtension | Where-Object { $_ })
          Say "Defender now: mode $($st.AMRunningMode), antivirus $($st.AntivirusEnabled), real-time $($st.RealTimeProtectionEnabled), on access $($st.OnAccessProtectionEnabled), behaviour $($st.BehaviorMonitorEnabled), IOAV $($st.IoavProtectionEnabled), script scanning $(-not $p.DisableScriptScanning), cloud (MAPS) $($p.MAPSReporting), block at first sight $(-not $p.DisableBlockAtFirstSeen), exclusions left $($left.Count), tamper protected $($st.IsTamperProtected), engine $($st.AMEngineVersion), signatures $($st.AntivirusSignatureVersion) ($($st.AntivirusSignatureLastUpdated))"
          # Run 44986491757: Defender came back on, but the AMSI control was not blocked and a 5007 (configuration changed)
          # came only after the window opened. So: what could keep AMSI off (Defender's AMSI provider, Defender policies),
          # the provider key put back if the image removed it, and the control retried for up to 2 minutes.
          $prov = '{2781761E-28E0-4109-99FE-B9D127C57AFE}'
          $provs = @(Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\AMSI\Providers' -ErrorAction SilentlyContinue | ForEach-Object { $_.PSChildName })
          $inproc = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\CLSID\$prov\InprocServer32" -ErrorAction SilentlyContinue).'(default)'
          Say "AMSI providers: $(if ($provs) { $provs -join ' ' } else { 'none' }); Defender's ($prov) in-process server: $(if ($inproc) { $inproc } else { 'not registered' })"
          if ($provs -notcontains $prov -and $inproc) { New-Item -Path "HKLM:\SOFTWARE\Microsoft\AMSI\Providers\$prov" -Force | Out-Null; Say "NOTE  Defender's AMSI provider key was missing: put back" }
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender', 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection', 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet') {
            $v = Get-ItemProperty $k -ErrorAction SilentlyContinue
            $pairs = if ($v) { @($v.PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object { "$($_.Name)=$($_.Value)" }) } else { @() }
            Say "policy $($k -replace '^HKLM:\\SOFTWARE\\Policies\\Microsoft\\', ''): $(if ($pairs) { $pairs -join ', ' } else { 'none' })"
          }
          # The controls: the AMSI test sample (built from two halves, so this script itself holds no sample) in
          # powershell.exe, the PowerShell Unvibe's auto read runs in; and the EICAR test file for real-time file scanning.
          $t = Get-Date
          $sample = 'AMSI Test Sa' + 'mple: 7e72c3ce-861b-4339-8740-0ac1484f1386'
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes("'$sample'"))
          $blocked = $false; $tries = 0; $res = ''
          while (-not $blocked -and $tries -lt 8) {
            $tries++
            $res = (& powershell.exe -NoProfile -NonInteractive -EncodedCommand $enc 2>&1 | Out-String).Trim()
            $blocked = $res -match 'malicious content'
            if (-not $blocked) { Start-Sleep -Seconds 15 }
          }
          # Run 44987641368 (windows-latest): powershell.exe never blocked it. The same in pwsh 7 tells whether AMSI is off
          # for Windows PowerShell only or for the whole machine (not part of the gate: Unvibe runs powershell.exe).
          $resP = (& pwsh -NoProfile -NonInteractive -EncodedCommand $enc 2>&1 | Out-String).Trim()
          Say "pwsh 7 given the same sample: $(if ($resP -match 'malicious content') { 'blocked' } else { 'NOT blocked' }); $((Get-CimInstance Win32_OperatingSystem).Caption) $([Environment]::OSVersion.Version); Defender platform $($st.AMProductVersion), service $($st.AMServiceVersion)"
          $eicar = Join-Path $env:RUNNER_TEMP 'qa-eicar.txt'
          try { [IO.File]::WriteAllText($eicar, 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR' + '-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*') } catch { }
          Start-Sleep -Seconds 8
          $eicarGone = -not (Test-Path $eicar)
          Remove-Item -Force $eicar -ErrorAction SilentlyContinue
          $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; Id = 1116, 1117; StartTime = $t } -ErrorAction SilentlyContinue)
          $names = @($ev | ForEach-Object { (($_.Message -split "`n") | Where-Object { $_ -match '^\s*Name:' } | Select-Object -First 1) -replace '^\s*Name:\s*', '' } | ForEach-Object { $_.Trim() } | Sort-Object -Unique)
          Say "control: powershell.exe given the AMSI test sample: $(if ($blocked) { "blocked (try $tries)" } else { "NOT blocked in $tries tries over about $($tries * 15) s ($($res.Substring(0, [Math]::Min(120, $res.Length))))" }); the EICAR test file $(if ($eicarGone) { 'removed' } else { 'NOT removed' }) 8 s after it was written; Defender/Operational 1116/1117 since: $($ev.Count)$(if ($names) { " ($($names -join ', '))" })"
          if ($st.RealTimeProtectionEnabled -and $st.AMRunningMode -eq 'Normal' -and $blocked -and $ev.Count -gt 0) { 'ready' | Set-Content "$env:RUNNER_TEMP\defender-ready.txt" }
          else { Say 'NOTE  Defender is not in a working real-time state on this runner (above), so SHOULD-384c will be untestable; the auto rows still run' }
          Start-Sleep -Seconds 2
          $t0 = (Get-Date).ToUniversalTime().ToString('o')
          $t0 | Set-Content "$env:RUNNER_TEMP\defender-t0.txt"
          Say "the check's window opens at $t0"

      # d5 (every mode; auto and auto-ai: launches X and Y, Cursor's path in CURSOR): the D5 rows (app/e2e/d5-button.mjs); a hosted call only with auto-ai. mouse.swift gives the Mac the real
      # pointer and the window list. A clean Mac for the prompt row: Unvibe's Accessibility row is removed from TCC.db first,
      # the same database the install step adds it to (tccutil said "No such bundle identifier" in run 44668914881 and
      # removed nothing); the script adds it again for its last launch, as the install step does. The raw net log stays in
      # $RUNNER_TEMP/netlog-d5 (never uploaded); the script keeps only time, method, path and status.
      - name: Walk the D5 button rows (d5 rows)
        if: inputs.d5 != '' && env.UNVIBE_EXE != '' && env.VSCODE != ''
        shell: bash
        env:
          SHOTS_DIR: ${{ runner.temp }}/d5
          UNVIBE_OS: ${{ matrix.label }}
          D5: ${{ inputs.d5 }}
          D5_PROFILE: ${{ runner.temp }}/d5-profile
          # Seeded into each new profile and pre-flagged above.
          D5_ID: qa-d5-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          NETLOG_DIR: ${{ runner.temp }}/netlog-d5
          VSCODE_DATA: ${{ runner.temp }}/d5-vscode
        run: |
          cp app/e2e/d5-button.mjs app/e2e/png.mjs app/e2e/netlog.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          if [ "$UNVIBE_OS" = mac ]; then
            swiftc -O -o "$RUNNER_TEMP/pw/mouse" app/e2e/mouse.swift
            export MOUSE="$RUNNER_TEMP/pw/mouse"
            db="/Library/Application Support/com.apple.TCC/TCC.db"
            sudo sqlite3 "$db" "DELETE FROM access WHERE client='com.unvibe.app' AND service='kTCCServiceAccessibility';"
            left=$(sudo sqlite3 "$db" "SELECT count(*) FROM access WHERE client='com.unvibe.app' AND service='kTCCServiceAccessibility';")
            echo "Unvibe's Accessibility rows after the removal: $left"
            if [ "$left" != 0 ]; then echo "::error::Unvibe's Accessibility row is still in TCC.db"; exit 1; fi
          fi
          status=0
          (cd "$RUNNER_TEMP/pw" && node d5-button.mjs) || status=$?
          rm -rf "$NETLOG_DIR"
          cat "$SHOTS_DIR/report-d5-$UNVIBE_OS.txt" || true
          exit $status

      # d5=auto-defender (Windows), SHOULD-384c judged: launch X's auto reads (auto-reads.txt, at least 10), then Protection
      # history (Get-MpThreatDetection) and Defender/Operational since the window opened: no detection, and no event naming
      # Unvibe or powershell.exe. PowerShell's own script-block warnings (4104, level 3) are counted too, not judged.
      - name: Check Microsoft Defender after the auto reads (d5=auto-defender, Windows)
        if: always() && inputs.d5 == 'auto-defender' && matrix.label == 'windows'
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\d5"; New-Item -ItemType Directory -Force $out | Out-Null
          $rep = "$out\report-defender.txt"
          function Say([string]$s) { $s; Add-Content -Path $rep -Value $s -Encoding utf8 }
          $t0f = "$env:RUNNER_TEMP\defender-t0.txt"
          if (-not (Test-Path $t0f)) { Say 'FAIL  SHOULD-384c: the Defender step did not run'; exit 1 }
          $t0 = [datetime]::Parse((Get-Content $t0f -Raw).Trim(), [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind).ToLocalTime()
          $readsF = "$out\auto-reads.txt"
          $reads = if (Test-Path $readsF) { [int](Get-Content $readsF -TotalCount 1) } else { 0 }
          $st = Get-MpComputerStatus
          $det = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -ge $t0 })
          $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; StartTime = $t0 } -ErrorAction SilentlyContinue)
          $ids = ($ev | Group-Object Id | Sort-Object { [int]$_.Name } | ForEach-Object { "$($_.Name) x$($_.Count)" }) -join ', '
          # Security's row: nothing for Unvibe or powershell.exe. Any other detection in the window is listed, not judged.
          $named = '(?i)unvibe|powershell'
          $bad = @(1006, 1007, 1008, 1015, 1116, 1117, 1118, 1119, 1120, 1121, 1122, 1125, 1126, 1127, 1128, 1160)
          $hits = @($ev | Where-Object { $_.Message -match $named })
          $other = @($ev | Where-Object { $bad -contains $_.Id -and $_.Message -notmatch $named })
          $detU = @($det | Where-Object { "$($_.ProcessName) $(@($_.Resources) -join ' ')" -match $named })
          foreach ($h in @($hits + $other) | Select-Object -First 8) { $m = $h.Message -replace '\s+', ' '; Say "  event $($h.Id) at $($h.TimeCreated.ToUniversalTime().ToString('HH:mm:ss'))Z: $($m.Substring(0, [Math]::Min(300, $m.Length)))" }
          foreach ($d in $det | Select-Object -First 5) { $th = Get-MpThreat -ThreatID $d.ThreatID -ErrorAction SilentlyContinue; Say "  detection $($th.ThreatName) at $($d.InitialDetectionTime.ToUniversalTime().ToString('HH:mm:ss'))Z: $($d.ProcessName) $(@($d.Resources) -join ' ')" }
          $ps = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-PowerShell/Operational'; Id = 4104; Level = 3; StartTime = $t0 } -ErrorAction SilentlyContinue)
          $psU = @($ps | Where-Object { $_.Message -match 'GetClipboardSequenceNumber|GetLastInputInfo' })
          Say "NOTE  PowerShell/Operational in the window: $($ps.Count) script-block warning(s) (4104, level 3), $($psU.Count) of them Unvibe's auto script (GetLastInputInfo / GetClipboardSequenceNumber in it); not part of the row"
          $detail = "$reads auto read(s) started an explanation (auto-reads.txt) from $($t0.ToUniversalTime().ToString('HH:mm:ss'))Z; Defender at the end: mode $($st.AMRunningMode), real-time $($st.RealTimeProtectionEnabled), cloud (MAPS) $((Get-MpPreference).MAPSReporting); Protection history in the window: $($det.Count) detection(s), $($detU.Count) for Unvibe/powershell; Defender/Operational in the window: $($ev.Count) event(s)$(if ($ids) { " ($ids)" }), $($hits.Count) naming Unvibe/powershell, $($other.Count) other detection(s)"
          if (-not (Test-Path "$env:RUNNER_TEMP\defender-ready.txt") -or -not $st.RealTimeProtectionEnabled -or $st.AMRunningMode -ne 'Normal') { Say "NOT TESTABLE  SHOULD-384c: Defender was not in a working real-time state (see the control); $detail"; exit 1 }
          if ($reads -lt 10) { Say "FAIL  SHOULD-384c: fewer than 10 auto reads; $detail"; exit 1 }
          if ($detU.Count -or $hits.Count) { Say "FAIL  SHOULD-384c: Defender logged Unvibe or powershell.exe in the window; $detail"; exit 1 }
          Say "PASS  SHOULD-384c: Defender at its defaults saw the auto reads and logged nothing for Unvibe or powershell.exe; $detail"

      # d5: whatever happened above, the hosts file holds none of this run's lines (the script put it back from its copy
      # and checked it byte for byte; a stopped script's copy is put back here), and no raw net log is left.
      - name: Put the hosts file back and delete the raw net logs (d5, Mac)
        if: always() && inputs.d5 != '' && matrix.label == 'mac'
        shell: bash
        run: |
          orig="$RUNNER_TEMP/hosts.d5.orig"
          if [ -f "$orig" ]; then
            sudo cp "$orig" /etc/hosts; sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; sudo rm -f "$orig"
            echo "put back from the script's saved copy"
          fi
          if grep -q '# unvibe-qa-d5$' /etc/hosts; then
            sudo sed -i '' '/# unvibe-qa-d5$/d' /etc/hosts; sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; echo "removed the marked lines"
          fi
          if grep -q 'unvibe-qa-d5' /etc/hosts; then echo "::error::a hosts line is still there"; exit 1; fi
          rm -rf "$RUNNER_TEMP/netlog-d5"
          echo "hosts clean (sha256 $(shasum -a 256 /etc/hosts | cut -d' ' -f1)); raw net logs deleted"

      - name: Put the hosts file back and delete the raw net logs (d5, Windows)
        if: always() && inputs.d5 != '' && matrix.label == 'windows'
        shell: pwsh
        run: |
          $hosts = 'C:\Windows\System32\drivers\etc\hosts'
          $orig = Join-Path $env:RUNNER_TEMP 'hosts.d5.orig'
          if (Test-Path $orig) { [IO.File]::WriteAllBytes($hosts, [IO.File]::ReadAllBytes($orig)); Remove-Item -Force $orig; ipconfig /flushdns | Out-Null; 'put back from the script''s saved copy' }
          if (@(Get-Content $hosts) -match '# unvibe-qa-d5$') { Set-Content -Path $hosts -Value (@(Get-Content $hosts) -notmatch '# unvibe-qa-d5$'); ipconfig /flushdns | Out-Null; 'removed the marked lines' }
          if (Select-String -Path $hosts -Pattern 'unvibe-qa-d5' -Quiet) { Write-Error 'a hosts line is still there'; exit 1 }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\netlog-d5" -ErrorAction SilentlyContinue
          "hosts clean (sha256 $((Get-FileHash $hosts -Algorithm SHA256).Hash.ToLower())); raw net logs deleted"

      # rc0155: whatever happened above, the hosts file is back byte for byte (from the copy rc-0155-ai.mjs saved before
      # its block, sha256 printed before and after) or, without a copy, holds none of this run's lines; and no raw net
      # log is left.
      - name: Put the hosts file back and delete the raw net logs (rc0155, Mac)
        if: always() && inputs.rc0155 != '' && matrix.label == 'mac'
        shell: bash
        run: |
          orig="$RUNNER_TEMP/hosts.orig"
          if [ -f "$orig" ]; then
            before=$(shasum -a 256 "$orig" | cut -d' ' -f1)
            now=$(shasum -a 256 /etc/hosts | cut -d' ' -f1)
            if [ "$before" != "$now" ]; then sudo cp "$orig" /etc/hosts; sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; echo "put back from the saved copy"; now=$(shasum -a 256 /etc/hosts | cut -d' ' -f1); fi
            echo "hosts sha256 before the block $before, now $now"
            if [ "$before" != "$now" ]; then echo "::error::the hosts file is not back byte for byte"; exit 1; fi
            rm -f "$orig"
          elif grep -q '# unvibe-qa-rc0155$' /etc/hosts; then
            sudo sed -i '' '/# unvibe-qa-rc0155$/d' /etc/hosts; sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; echo "no saved copy: removed the marked lines"
          else
            echo "no block was made: hosts sha256 $(shasum -a 256 /etc/hosts | cut -d' ' -f1)"
          fi
          if grep -q 'unvibe-qa-rc0155' /etc/hosts; then echo "::error::a hosts line is still there"; exit 1; fi
          rm -rf "$RUNNER_TEMP/netlog"
          echo "hosts clean; raw net logs deleted"

      - name: Put the hosts file back and delete the raw net logs (rc0155, Windows)
        if: always() && inputs.rc0155 != '' && matrix.label == 'windows'
        shell: pwsh
        run: |
          $hosts = 'C:\Windows\System32\drivers\etc\hosts'
          $orig = Join-Path $env:RUNNER_TEMP 'hosts.orig'
          if (Test-Path $orig) {
            $before = (Get-FileHash $orig -Algorithm SHA256).Hash.ToLower()
            $now = (Get-FileHash $hosts -Algorithm SHA256).Hash.ToLower()
            if ($before -ne $now) { [IO.File]::WriteAllBytes($hosts, [IO.File]::ReadAllBytes($orig)); ipconfig /flushdns | Out-Null; 'put back from the saved copy'; $now = (Get-FileHash $hosts -Algorithm SHA256).Hash.ToLower() }
            "hosts sha256 before the block $before, now $now"
            if ($before -ne $now) { Write-Error 'the hosts file is not back byte for byte'; exit 1 }
            Remove-Item -Force $orig
          } elseif (@(Get-Content $hosts) -match '# unvibe-qa-rc0155$') {
            Set-Content -Path $hosts -Value (@(Get-Content $hosts) -notmatch '# unvibe-qa-rc0155$'); ipconfig /flushdns | Out-Null; 'no saved copy: removed the marked lines'
          } else {
            "no block was made: hosts sha256 $((Get-FileHash $hosts -Algorithm SHA256).Hash.ToLower())"
          }
          if (Select-String -Path $hosts -Pattern 'unvibe-qa-rc0155' -Quiet) { Write-Error 'a hosts line is still there'; exit 1 }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\netlog" -ErrorAction SilentlyContinue
          'hosts clean; raw net logs deleted'

      # The website's Windows download is the portable exe, so open that exact file too.
      - name: Open the portable exe the website serves (Windows)
        if: always() && matrix.label == 'windows' && steps.ver.outputs.v != '' && !startsWith(inputs.rc0154, 'ai-') && !startsWith(inputs.rc0155, 'ai-') && inputs.rc0155 != 'link' && inputs.rc0157 == '' && inputs.d5 == ''
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.v }}
          BUILD_RUN: ${{ inputs.build_run }}
          # Pre-flagged above; seeded into the profile so the portable app uses it instead of a random id.
          PORTABLE_INSTALL_ID: qa-portable-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $v = $env:V
          $exe = "$env:RUNNER_TEMP\portable\Unvibe.exe"
          New-Item -ItemType Directory -Force (Split-Path $exe), "$env:RUNNER_TEMP\shots" | Out-Null
          if ($env:BUILD_RUN) {
            Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\build" -Filter '*-win-x64-portable.exe' | Select-Object -First 1).FullName $exe
          } else {
            Invoke-WebRequest -Uri "https://github.com/ShadowEsu/Unvibe/releases/download/v$v/Unvibe-$v-win-x64-portable.exe" -OutFile $exe
          }
          "portable: $((Get-Item $exe).Length) bytes, version $((Get-Item $exe).VersionInfo.ProductVersion), sha256 $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $env:UNVIBE_USER_DATA = "$env:RUNNER_TEMP\portable-profile"
          $seed = Join-Path $env:UNVIBE_USER_DATA 'unvibe-store.json'
          New-Item -ItemType Directory -Force $env:UNVIBE_USER_DATA | Out-Null
          # No BOM: the app's JSON.parse would reject one and start a fresh store with a random id.
          if (-not (Test-Path $seed)) { [IO.File]::WriteAllText($seed, (@{ installId = $env:PORTABLE_INSTALL_ID } | ConvertTo-Json -Compress)) }
          Start-Process -FilePath $exe
          $win = $null
          for ($i = 0; $i -lt 45 -and -not $win; $i++) {
            Start-Sleep -Seconds 2
            $win = Get-Process Unvibe -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          }
          if (-not $win) {
            Get-Process | Where-Object { $_.ProcessName -match 'Unvibe' } | Format-Table ProcessName, Id, Path | Out-String | Write-Host
            Write-Error 'The portable exe did not open a window'; exit 1
          }
          "window '$($win.MainWindowTitle)' from $($win.Path)"
          # Still open after 10 seconds: the first run did not crash behind its window.
          Start-Sleep -Seconds 10
          if (-not (Get-Process -Id $win.Id -ErrorAction SilentlyContinue)) { Write-Error 'The portable app closed itself after opening'; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\shots\portable-first-launch.png")
          "PASS  Portable exe opens and stays open"
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          # The seeded store still loads: the id is unchanged and the app added its own keys to it.
          $after = Get-Content $seed -Raw | ConvertFrom-Json -AsHashtable
          "portable store after launch: installId=$($after['installId']) keys=$((@($after.Keys) | Sort-Object) -join ',')"
          if ($after['installId'] -ne $env:PORTABLE_INSTALL_ID) { Write-Error 'The portable app replaced the seeded QA install id'; exit 1 }

      # Leave this run's installs out of founder stats: the walkthrough's profile on both systems,
      # on Windows the portable exe's, rc0154's profiles (walk: two; ai: one, or two with full), rc0155's (walk: the
      # control's and the RC rows'; ai: one), rc0157's (setup: the Mac's one; Windows 100 % and 150 %) and d5's (a, b on Windows, c, x, y). Only this step has the admin token, and Unvibe is stopped
      # first, so the app under test never runs with it. Runs even after a failed check. Fails when
      # the API answers anything but 200 with matched true: a 200 alone does not prove the app's own
      # install row was flagged (Security, 31 Oct).
      - name: Flag this run's installs as QA
        if: always()
        shell: pwsh
        env:
          # CI-only: this token can flag a test install as QA and nothing else.
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
          RC0155: ${{ inputs.rc0155 }}
        run: |
          Get-Process Unvibe -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $env:UNVIBE_QA_FLAG_TOKEN) { 'QA install flag: no token, so these installs count as real'; exit 1 }
          $failed = 0
          $names = @('walkthrough-profile', 'portable-profile', 'rc0154-upgrade-profile', 'rc0154-profile', 'rc0154-ai-profile', 'rc0154-sample-profile', 'rc0154-hero-profile', 'rc0155-control-profile', 'rc0155-profile', 'rc0155-ai-profile', 'setup0157-profile-mac', 'setup0157-profile-100', 'setup0157-profile-150', 'd5-profile-a', 'd5-profile-b', 'd5-profile-f', 'd5-profile-c', 'd5-profile-x', 'd5-profile-y')
          # rc0155 link: the probe's per-way profiles, and the app's default profile it seeded (Combine keeps a rooted path).
          # rc0155 ai-windows: the default profile too, in case a second Unvibe started there (run 44658289654).
          if ($env:RC0155 -eq 'link') { $names += @('rc0155-link54-profile-A', 'rc0155-link54-profile-B', 'rc0155-link-profile-A', 'rc0155-link-profile-B', (Join-Path $env:APPDATA 'Unvibe')) }
          if ($env:RC0155 -eq 'ai-windows') { $names += @((Join-Path $env:APPDATA 'Unvibe')) }
          foreach ($name in $names) {
            $store = [IO.Path]::Combine($env:RUNNER_TEMP, $name, 'unvibe-store.json')
            if (-not (Test-Path $store)) { "QA install flag ($name): skipped, no store"; continue }
            try {
              $installId = (Get-Content $store -Raw | ConvertFrom-Json -AsHashtable)['installId']
              if (-not $installId) { "QA install flag ($name): skipped, no installId in the store"; continue }
              $r = Invoke-WebRequest -Method Post -Uri 'https://api.unvibe.site/api/v1/admin/qa-install' -UseBasicParsing `
                -Headers @{ authorization = "Bearer $env:UNVIBE_QA_FLAG_TOKEN" } -ContentType 'application/json' `
                -Body (@{ installId = $installId } | ConvertTo-Json -Compress)
              $matched = ($r.Content | ConvertFrom-Json).matched
              "QA install flag ($name): $($r.StatusCode) matched=$matched"
              # d5=auto: launch X ran behind the hosts block from start to end, so its install never reached the API;
              # its id was stored by the pre-flag step, which flags the row if it ever appears.
              if ($name -eq 'd5-profile-x' -and $r.StatusCode -eq 200 -and $matched -eq $false) { "QA install flag ($name): no install row (launch X never reached the API); the id stays pre-flagged"; continue }
              if ($r.StatusCode -ne 200 -or $matched -ne $true) { "QA install flag ($name): the app's install row was not flagged"; $failed++ }
            } catch { "QA install flag ($name) failed: $($_.Exception.Message)"; $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-walkthrough
          path: ${{ runner.temp }}/shots
          retention-days: 14

      - name: Upload the 0.1.54 RC rows
        if: always() && (inputs.rc0154 != '' || inputs.rc0155 == 'walk')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-rc0154
          path: ${{ runner.temp }}/rc0154
          if-no-files-found: ignore
          retention-days: 14

      # rc0155's reports, stills and net-log summaries (time, method, path, status); the raw net logs are never in it.
      - name: Upload the 0.1.55 RC rows
        if: always() && inputs.rc0155 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-rc0155
          path: ${{ runner.temp }}/rc0155
          if-no-files-found: ignore
          retention-days: 14

      # rc0157's report, crops, stills and net-log summaries (time, method, path, status); the raw net log is never in it.
      - name: Upload the 0.1.57 setup rows
        if: always() && inputs.rc0157 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-setup0157
          path: ${{ runner.temp }}/setup0157
          if-no-files-found: ignore
          retention-days: 14

      # d5's report, crops, stills and net-log summaries (time, method, path, status); the raw net log is never in it.
      - name: Upload the D5 button rows
        if: always() && inputs.d5 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-d5
          path: ${{ runner.temp }}/d5
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the desktop recording
        if: always() && inputs.desktop_recording
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-${{ matrix.label }}-desktop-recording
          path: ${{ runner.temp }}/desktop-recording
          if-no-files-found: ignore
          retention-days: 14

      # Fresh website media from the same installed build: real screenshots and window recordings.
      - name: Record website media (Mac)
        id: media
        if: always() && matrix.label == 'mac' && env.UNVIBE_EXE != '' && env.QA_AI_OK == '1' && !startsWith(inputs.rc0154, 'ai-') && !startsWith(inputs.rc0155, 'ai-') && inputs.d5 == ''
        continue-on-error: true
        shell: bash
        env:
          MEDIA_DIR: ${{ runner.temp }}/media
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          # A fresh install per run: one reused id spends its 50 free explanations and then every
          # capture shows the limit instead of an answer. The next step flags it as QA.
          MEDIA_INSTALL_ID: qa-media-${{ github.run_id }}-${{ github.run_attempt }}
          MEDIA_SAMPLES: ${{ inputs.media_samples && '1' || '' }}
        run: |
          cp app/e2e/marketing-media.mjs app/e2e/cdp-launch.mjs "$RUNNER_TEMP/pw/"
          cp -R app/e2e/media-samples "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw" && node marketing-media.mjs

      - name: Flag the media install as QA (Mac)
        if: always() && matrix.label == 'mac' && env.UNVIBE_EXE != '' && env.QA_AI_OK == '1' && !startsWith(inputs.rc0154, 'ai-') && !startsWith(inputs.rc0155, 'ai-') && inputs.d5 == ''
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
          MEDIA_INSTALL_ID: qa-media-${{ github.run_id }}-${{ github.run_attempt }}
          MEDIA_OUTCOME: ${{ steps.media.outcome }}
        run: |
          if [ -z "$UNVIBE_QA_FLAG_TOKEN" ]; then echo 'QA install flag (media): no token, so this install counts as real'; exit 1; fi
          # The header goes in on stdin (printf is a shell builtin), so the token is never in a process's arguments.
          answer=$(printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -w '\n%{http_code}' \
            -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' \
            --data "{\"installId\":\"$MEDIA_INSTALL_ID\"}") || answer=$'\ncurl failed'
          code=$(printf '%s' "$answer" | tail -n 1)
          matched=$(printf '%s' "$answer" | head -n 1 | grep -o '"matched":[a-z]*' | cut -d: -f2)
          echo "QA install flag (media): $code matched=${matched:-none}"
          if [ "$code" = 200 ] && [ "$matched" = true ]; then exit 0; fi
          # A capture that failed before the app reached the API leaves nothing to flag; the media step already shows that.
          if [ "$MEDIA_OUTCOME" != success ]; then echo "QA install flag (media): no match after a media step that ended '$MEDIA_OUTCOME'"; exit 0; fi
          echo "QA install flag (media): the app's install row was not flagged"; exit 1

      - name: Upload website media
        if: always() && matrix.label == 'mac' && env.QA_AI_OK == '1' && !startsWith(inputs.rc0154, 'ai-') && !startsWith(inputs.rc0155, 'ai-') && inputs.d5 == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unvibe-mac-website-media
          path: ${{ runner.temp }}/media
          if-no-files-found: ignore
          retention-days: 14
