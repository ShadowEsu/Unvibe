name: IndexNow

# After Vercel reports a successful Production deployment of the site, submit the new and changed unvibe.site URLs
# to IndexNow (Bing, Yandex, Seznam, Naver). The previous deployed commit comes from the Deployments API (the newest
# successful Production deployment of another commit); nothing is kept between runs. Vercel's deployments carry a
# commit SHA as `ref`, so actions/cache would never restore or save here (GITHUB_REF is empty on these runs).
# Read-only on the repo; the IndexNow key is public by design (marketing/scripts/indexnow.mjs).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit the whole live sitemap (reset)"
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Previous successful production deploy
        id: prev
        if: inputs.all != true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          prev=""
          for id_sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=30" --jq '.[] | "\(.id):\(.sha)"'); do
            id=${id_sha%%:*}; sha=${id_sha#*:}
            [ "$sha" = "$SHA" ] && continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then prev=$sha; break; fi
          done
          echo "sha=$prev" >> "$GITHUB_OUTPUT"
          echo "this $SHA, previous successful ${prev:-none}"
      - name: Submit
        working-directory: marketing
        env:
          SHA: ${{ github.event.deployment.sha || github.sha }}
          PREV: ${{ steps.prev.outputs.sha }}
        run: |
          if [ "${{ inputs.all }}" = "true" ] || [ -z "$PREV" ]; then
            node scripts/indexnow.mjs --all
          else
            node scripts/indexnow.mjs --prev-sha "$PREV" --sha "$SHA"
          fi
