# QA only, never merged: real-macOS proof for BUGS F-02 (fix/mac-system-events-prompt) against v0.1.49.
# A: a fresh install's first launch — does Unvibe ask macOS for System Events before setup?
# B: after "Don't Allow" (an Automation deny row for com.unvibe.app → System Events), what does Control+U show?
# Every install id is flagged as QA before launch (Security file 2332, B-1).
name: qa-f02-automation-proof
on:
  push:
    branches: [qa/f02-automation-proof]
permissions:
  contents: read
  actions: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Design stills for #206 (f7ba3aa2): timeout note, denied note at the panel's minimum size, light + dark.
          # (fix vs pre-review vs v0.1.49 was run 42188351965.)
          - build: fix
            tag: fix
            run: "42187582954"
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # Install ids allow only letters, digits, - and _ (qa-install answers 400 to a dot).
      ID_A: qa-f02a-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag }}
      ID_B: qa-f02b-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag }}
      ID_C: qa-f02c-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag }}
      ID_D: qa-f02d-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag }}
      ID_E: qa-f02e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag }}
    steps:
      - name: Flag this run's install ids as QA before any launch
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
        run: |
          if [ -z "$UNVIBE_QA_FLAG_TOKEN" ]; then echo "::error::no QA flag token; nothing was launched"; exit 1; fi
          for id in "$ID_A" "$ID_B" "$ID_C" "$ID_D" "$ID_E"; do
            answer=$(printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -m 30 -w '\n%{http_code}' \
              -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' \
              --data "{\"installId\":\"$id\"}") || { echo "::error::pre-flag $id: curl failed"; exit 1; }
            code=$(printf '%s' "$answer" | tail -n 1)
            matched=$(printf '%s' "$answer" | head -n 1 | grep -o '"matched":[a-z]*' | cut -d: -f2) || true
            echo "QA pre-flag $id: $code matched=${matched:-none}"
            if [ "$code" != 200 ] || { [ "$matched" != true ] && [ "$matched" != false ]; }; then exit 1; fi
          done

      - name: Get the fix build
        if: matrix.run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unvibe-macos-latest
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build

      - name: Install Unvibe and allow Accessibility (as real-device-test does)
        shell: bash
        run: |
          arch=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x64)
          if [ -n "${{ matrix.run }}" ]; then cp "$(ls "$RUNNER_TEMP"/build/*-mac-$arch.dmg | head -1)" "$RUNNER_TEMP/Unvibe.dmg"
          else curl -fL -o "$RUNNER_TEMP/Unvibe.dmg" "https://github.com/ShadowEsu/Unvibe/releases/download/v0.1.49/Unvibe-0.1.49-mac-$arch.dmg"; fi
          mnt="$RUNNER_TEMP/mnt"; mkdir -p "$mnt" "$RUNNER_TEMP/shots"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/Unvibe.dmg"
          ditto "$mnt/Unvibe.app" /Applications/Unvibe.app
          hdiutil detach "$mnt" -force || true
          xattr -cr /Applications/Unvibe.app
          defaults read /Applications/Unvibe.app/Contents/Info.plist CFBundleShortVersionString
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          for c in com.unvibe.app com.apple.systemevents com.apple.Terminal; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES('kTCCServiceAccessibility','$c',0,2,4,1,'UNUSED',0);" || true
          done

      - name: "A: first launch of a fresh install (not set up yet)"
        shell: bash
        run: |
          ud="$HOME/Library/Application Support/Unvibe"
          rm -rf "$ud"; mkdir -p "$ud"
          printf '{"installId":"%s"}' "$ID_A" > "$ud/unvibe-store.json"
          open -a /Applications/Unvibe.app
          pid=""; for i in $(seq 1 40); do pid=$(pgrep -x Unvibe | head -1 || true); [ -n "$pid" ] && break; sleep 0.5; done
          echo "Unvibe pid ${pid:-none}"
          seen=0; spawned=0
          for i in $(seq 1 40); do
            n=$( (pgrep -P "${pid:-0}" -x osascript || true) | wc -l | tr -d ' ')
            [ "$n" -gt 0 ] && spawned=$((spawned + 1))
            sleep 0.5
          done
          echo "A: samples (of 40, over 20 s) with an osascript child of Unvibe: $spawned"
          # tccd shows the Automation question through UserNotificationCenter.
          prompt=$(osascript -e 'tell application "System Events" to if exists process "UserNotificationCenter" then get name of every window of process "UserNotificationCenter"' 2>&1 || true)
          echo "A: UserNotificationCenter windows: [${prompt}]"
          screencapture -x "$RUNNER_TEMP/shots/a-first-launch-${{ matrix.build }}.png"
          osascript -e 'tell application "Unvibe" to quit' || true; sleep 2; pkill -x Unvibe || true; sleep 1
          echo "A: store after launch: $(grep -o '"installId":"[^"]*"' "$ud/unvibe-store.json" || echo none)"

      - name: "C: before setup is done, an IDE-link clipboard explain (consent given)"
        shell: bash
        run: |
          ud="$HOME/Library/Application Support/Unvibe"
          rm -rf "$ud"; mkdir -p "$ud"
          printf '{"installId":"%s"}' "$ID_C" > "$ud/unvibe-store.json"
          printf '{"records":[{"items":["ai_send","terms","age_18"],"provider":"unvibe","policyVersion":"2026-10-30","agreedAt":"%s"}]}' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > "$ud/unvibe-consent.json"
          open -a /Applications/Unvibe.app
          pid=""; for i in $(seq 1 40); do pid=$(pgrep -x Unvibe | head -1 || true); [ -n "$pid" ] && break; sleep 0.5; done
          echo "Unvibe pid ${pid:-none}"
          sleep 6
          before=0
          for i in $(seq 1 10); do n=$( (pgrep -P "${pid:-0}" -x osascript || true) | wc -l | tr -d ' '); [ "$n" -gt 0 ] && before=$((before + 1)); sleep 0.5; done
          echo "C: samples (of 10) with an osascript child before the link: $before"
          printf 'const total = items.reduce((sum, item) => sum + item.price, 0);\n' | pbcopy
          open 'unvibe://review?source=ide'
          spawned=0
          for i in $(seq 1 30); do n=$( (pgrep -P "${pid:-0}" -x osascript || true) | wc -l | tr -d ' '); [ "$n" -gt 0 ] && spawned=$((spawned + 1)); sleep 0.5; done
          echo "C: samples (of 30, over 15 s) with an osascript child after the clipboard explain: $spawned"
          screencapture -x "$RUNNER_TEMP/shots/c-clipboard-before-setup-${{ matrix.build }}.png"
          osascript -e 'tell application "Unvibe" to quit' || true; sleep 2; pkill -x Unvibe || true; sleep 1
          echo "C: store after launch: $(grep -o '"installId":"[^"]*"' "$ud/unvibe-store.json" || echo none)"

      - name: "D: set up, macOS still asking about System Events, Control+U (timeout note)"
        shell: bash
        run: |
          ud="$HOME/Library/Application Support/Unvibe"
          rm -rf "$ud"; mkdir -p "$ud"
          printf '{"installId":"%s"}' "$ID_D" > "$ud/unvibe-store.json"
          # settingsRevision 8 keeps it set up (an older revision resets onboarding); the panel at its 420x460 minimum.
          printf '{"settingsRevision":8,"appearanceRevision":2,"onboarded":true,"theme":"light","lastWidgetBounds":{"x":40,"y":60,"width":420,"height":460}}' > "$ud/unvibe-settings.json"
          printf '{"records":[{"items":["ai_send","terms","age_18"],"provider":"unvibe","policyVersion":"2026-10-30","agreedAt":"%s"}]}' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > "$ud/unvibe-consent.json"
          printf 'function selectedTotal(items) {\n  return items.reduce((sum, item) => sum + item.price * item.qty, 0);\n}\n' > "$RUNNER_TEMP/unvibe-sample.js"
          open -a /Applications/Unvibe.app
          sleep 8
          open -a TextEdit "$RUNNER_TEMP/unvibe-sample.js"; sleep 3
          # macOS's System Events question blocks every Apple Event to System Events, the runner's
          # keystrokes included (-1712). unvibe://review (no query) runs the same capture as the shortcut.
          open 'unvibe://review'
          for t in 4 8 14; do sleep $([ $t = 4 ] && echo 4 || { [ $t = 8 ] && echo 4 || echo 6; }); screencapture -x "$RUNNER_TEMP/shots/d-macos-asking-${t}s-${{ matrix.build }}.png"; done
          osascript -e 'tell application "Unvibe" to quit' || true; sleep 2; pkill -x Unvibe || true
          echo "D: store after launch: $(grep -o '"installId":"[^"]*"' "$ud/unvibe-store.json" || echo none)"

      - name: "B: set up, Don't Allow System Events, Control+U in TextEdit (light, then dark; panel at its minimum size)"
        shell: bash
        run: |
          # What "Don't Allow" stores: Automation for com.unvibe.app → System Events, denied.
          udb="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          sqlite3 "$udb" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags) VALUES('kTCCServiceAppleEvents','com.unvibe.app',0,0,2,1,0,'com.apple.systemevents',0);" \
            || sudo sqlite3 "$udb" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags) VALUES('kTCCServiceAppleEvents','com.unvibe.app',0,0,2,1,0,'com.apple.systemevents',0);"
          sqlite3 "$udb" "SELECT service,client,auth_value,indirect_object_identifier FROM access WHERE client='com.unvibe.app';" || sudo sqlite3 "$udb" "SELECT service,client,auth_value,indirect_object_identifier FROM access WHERE client='com.unvibe.app';"
          killall -u "$USER" tccd 2>/dev/null || true
          # Leg D's question may still be up and blocking System Events: clear it and wait until it answers.
          killall UserNotificationCenter 2>/dev/null || true
          ok=no; for i in $(seq 1 20); do osascript -e 'tell application "System Events" to get name of first process' >/dev/null 2>&1 && { ok=yes; break; }; sleep 2; done
          echo "B: System Events answers the runner: $ok"
          ud="$HOME/Library/Application Support/Unvibe"
          for theme in light dark; do
            id="$ID_B"; [ "$theme" = dark ] && id="$ID_E"
            rm -rf "$ud"; mkdir -p "$ud"
            printf '{"installId":"%s"}' "$id" > "$ud/unvibe-store.json"
            printf '{"settingsRevision":8,"appearanceRevision":2,"onboarded":true,"theme":"%s","lastWidgetBounds":{"x":40,"y":60,"width":420,"height":460}}' "$theme" > "$ud/unvibe-settings.json"
            printf '{"records":[{"items":["ai_send","terms","age_18"],"provider":"unvibe","policyVersion":"2026-10-30","agreedAt":"%s"}]}' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > "$ud/unvibe-consent.json"
            open -a /Applications/Unvibe.app
            sleep 8
            open -a TextEdit "$RUNNER_TEMP/unvibe-sample.js"; sleep 3
            osascript -e 'tell application "TextEdit" to activate' -e 'delay 1' -e 'tell application "System Events" to keystroke "a" using command down'
            sleep 1
            osascript -e 'tell application "System Events" to keystroke "u" using control down'
            for t in 3 7 12; do sleep $([ $t = 3 ] && echo 3 || echo 4); screencapture -x "$RUNNER_TEMP/shots/b-denied-$theme-min-${t}s-${{ matrix.build }}.png"; done
            osascript -e 'tell application "Unvibe" to quit' || true; sleep 2; pkill -x Unvibe || true; sleep 1
            echo "B ($theme): store after launch: $(grep -o '"installId":"[^"]*"' "$ud/unvibe-store.json" || echo none)"
            echo "B ($theme): settings after launch: $(grep -o '"onboarded":[a-z]*\|"theme":"[a-z]*"\|"lastWidgetBounds":{[^}]*}' "$ud/unvibe-settings.json" | tr '\n' ' ')"
          done

      - name: Flag the ids again (the app has registered them now)
        if: always()
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
        run: |
          for id in "$ID_A" "$ID_B" "$ID_C" "$ID_D" "$ID_E"; do
            answer=$(printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -m 30 -w '\n%{http_code}' \
              -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' \
              --data "{\"installId\":\"$id\"}") || answer=$'\ncurl failed'
            echo "QA flag $id: $(printf '%s' "$answer" | tail -n 1) $(printf '%s' "$answer" | head -n 1)"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: f02-proof-${{ matrix.build }}
          path: ${{ runner.temp }}/shots
          retention-days: 14
