name: PR checks

# Typecheck and unit tests for every package on each pull request, so "green CI"
# means the code was tested, not only that the site preview built.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [web, app, marketing]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # supabase-js 2.110 needs the native WebSocket that Node 22 provides.
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install
        run: npm ci
        env:
          # Electron's binary is not needed for typecheck or unit tests.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: Lint
        if: matrix.package == 'marketing'
        run: npm run lint

  extension:
    name: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
