name: Desktop app release

on:
  push:
    tags:
      - "app-v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built artifacts to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One OS at a time so both jobs never race to create the same GitHub release.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            platformFlag: --mac
          - os: windows-latest
            platformFlag: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Without these the packaged app talks to http://localhost:8787 and sign-in cannot work.
      - name: Require release backend settings
        shell: bash
        env:
          UNVIBE_BACKEND: ${{ secrets.UNVIBE_BACKEND }}
          UNVIBE_TRIAL_TOKEN: ${{ secrets.UNVIBE_TRIAL_TOKEN }}
        run: |
          if [[ "$UNVIBE_BACKEND" != https://* ]]; then echo "Set the UNVIBE_BACKEND repository secret to the HTTPS API origin."; exit 1; fi
          if [ "${#UNVIBE_TRIAL_TOKEN}" -lt 24 ]; then echo "Set the UNVIBE_TRIAL_TOKEN repository secret to the production trial token."; exit 1; fi

      # The VS Code / Cursor "Desktop Bridge" is what makes ⌘U work inside those editors.
      # It ships inside the app (extraResources), so build it before packaging and fail loudly
      # if it is missing instead of shipping an app without it.
      - name: Build editor bridge
        working-directory: extension
        shell: bash
        run: |
          npm ci
          npm run build
          mkdir -p release
          npm run package < /dev/null
          test -f release/unvibe-desktop-bridge-0.1.2.vsix

      # Optional stable signing identity (self-signed, not Apple-issued). With it every Mac
      # build has the same signature, so macOS keeps the Accessibility permission and the
      # keychain stops asking for the login password after each update. Without the secrets
      # the build falls back to ad-hoc signing in scripts/afterPackHook.cjs.
      - name: Prepare stable Mac signing identity
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MAC_SELF_SIGN_P12: ${{ secrets.MAC_SELF_SIGN_P12 }}
          MAC_SELF_SIGN_PASSWORD: ${{ secrets.MAC_SELF_SIGN_PASSWORD }}
        run: |
          if [ -z "$MAC_SELF_SIGN_P12" ] || [ -z "$MAC_SELF_SIGN_PASSWORD" ]; then
            echo "No stable signing identity configured; builds use ad-hoc signing."
            exit 0
          fi
          kc="$RUNNER_TEMP/unvibe-sign.keychain-db"
          kcpass="$(uuidgen)"
          echo "$MAC_SELF_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MAC_SELF_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # Trust the certificate for code signing on this runner only, so codesign accepts it.
          security find-certificate -c "Unvibe Self Signed" -p "$kc" > "$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem"
          rm -f "$RUNNER_TEMP/sign.p12"
          security find-identity -v -p codesigning "$kc"
          echo "UNVIBE_SIGN_IDENTITY=Unvibe Self Signed" >> "$GITHUB_ENV"
          echo "UNVIBE_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          UNVIBE_BACKEND: ${{ secrets.UNVIBE_BACKEND }}
          UNVIBE_TRIAL_TOKEN: ${{ secrets.UNVIBE_TRIAL_TOKEN }}
        run: npm run build

      - name: Package (publish to release)
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish as a visible pre-release instead of a hidden draft, so site download links work.
          EP_DRAFT: "false"
          EP_PRE_RELEASE: "true"
          # Optional: set these repo secrets to code-sign and notarize the macOS build.
          # Without them the app is ad-hoc signed by scripts/afterPackHook.cjs so Apple silicon opens it.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          # An unset repo secret arrives as an empty string, which electron-builder misreads as a path.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Spotlight indexing a freshly mounted DMG keeps it busy, so "hdiutil detach" fails
            # and the Apple silicon DMG never uploads. Indexing is useless on a CI runner.
            sudo mdutil -a -i off >/dev/null 2>&1 || true
          fi
          # One retry covers a DMG still busy after the first attempt; already uploaded files are skipped.
          npx electron-builder ${{ matrix.platformFlag }} --publish always || {
            echo "Packaging failed once, retrying after detaching leftover disk images."
            if [ "$RUNNER_OS" = "macOS" ]; then
              for v in /Volumes/Install\ Unvibe*; do [ -d "$v" ] && hdiutil detach -force "$v" || true; done
            fi
            sleep 10
            npx electron-builder ${{ matrix.platformFlag }} --publish always
          }

      # SHA-256 for every installer, uploaded next to it, so people (and install.sh) can verify
      # the download before running it.
      - name: Publish checksums
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          cd release
          if [ "$RUNNER_OS" = "macOS" ]; then
            f=SHA256SUMS-mac.txt; shasum -a 256 Unvibe-*.dmg > "$f"
          else
            f=SHA256SUMS-windows.txt; sha256sum Unvibe-*.exe | sed 's/ \*/  /' > "$f"
          fi
          cat "$f"
          gh release upload "v$v" "$f" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Package (build only, no publish)
        if: startsWith(github.ref, 'refs/tags/app-v') == false && inputs.publish != true
        run: npx electron-builder ${{ matrix.platformFlag }} --publish never

      - name: Verify Mac installers open on Apple silicon and Intel
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          for dmg in release/*.dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            app="$mnt/Unvibe.app"
            echo "== $dmg"
            codesign --verify --deep --strict --verbose=2 "$app"
            ls "$mnt/.background" >/dev/null
            arch="$(lipo -archs "$app/Contents/MacOS/Unvibe")"
            echo "arch: $arch"
            if [ "$arch" = "arm64" ]; then
              # Apple silicon kills binaries with a broken signature, so actually start it.
              ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Unvibe" -e "console.log('starts', process.versions.electron)"
            fi
            hdiutil detach "$mnt" -force >/dev/null
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unvibe-${{ matrix.os }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
          if-no-files-found: warn
          retention-days: 14
