name: Desktop app release

on:
  push:
    tags:
      - "app-v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built artifacts to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One OS at a time so both jobs never race to create the same GitHub release.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            platformFlag: --mac
          - os: windows-latest
            platformFlag: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Without these the packaged app talks to http://localhost:8787 and sign-in cannot work.
      - name: Require release backend settings
        shell: bash
        env:
          UNVIBE_BACKEND: ${{ secrets.UNVIBE_BACKEND }}
          UNVIBE_TRIAL_TOKEN: ${{ secrets.UNVIBE_TRIAL_TOKEN }}
        run: |
          if [[ "$UNVIBE_BACKEND" != https://* ]]; then echo "Set the UNVIBE_BACKEND repository secret to the HTTPS API origin."; exit 1; fi
          if [ "${#UNVIBE_TRIAL_TOKEN}" -lt 24 ]; then echo "Set the UNVIBE_TRIAL_TOKEN repository secret to the production trial token."; exit 1; fi

      - name: Build app bundle
        env:
          UNVIBE_BACKEND: ${{ secrets.UNVIBE_BACKEND }}
          UNVIBE_TRIAL_TOKEN: ${{ secrets.UNVIBE_TRIAL_TOKEN }}
        run: npm run build

      - name: Package (publish to release)
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish as a visible pre-release instead of a hidden draft, so site download links work.
          EP_DRAFT: "false"
          EP_PRE_RELEASE: "true"
          # Optional: set these repo secrets to code-sign and notarize the macOS build.
          # Without them the app is ad-hoc signed by scripts/afterPackHook.cjs so Apple silicon opens it.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          # An unset repo secret arrives as an empty string, which electron-builder misreads as a path.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder ${{ matrix.platformFlag }} --publish always

      - name: Package (build only, no publish)
        if: startsWith(github.ref, 'refs/tags/app-v') == false && inputs.publish != true
        run: npx electron-builder ${{ matrix.platformFlag }} --publish never

      - name: Verify Mac installers open on Apple silicon and Intel
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          for dmg in app/release/*.dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            app="$mnt/Unvibe.app"
            echo "== $dmg"
            codesign --verify --deep --strict --verbose=2 "$app"
            ls "$mnt/.background" >/dev/null
            arch="$(lipo -archs "$app/Contents/MacOS/Unvibe")"
            echo "arch: $arch"
            if [ "$arch" = "arm64" ]; then
              # Apple silicon kills binaries with a broken signature, so actually start it.
              ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Unvibe" -e "console.log('starts', process.versions.electron)"
            fi
            hdiutil detach "$mnt" -force >/dev/null
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unvibe-${{ matrix.os }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
          if-no-files-found: warn
          retention-days: 14
