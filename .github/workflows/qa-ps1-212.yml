name: QA install.ps1 per-user setup check

# QA only (#212 re-pin, BOSS row 545; Security P-1..P-4 + forced-retry rows): #212's install.ps1 (committed copy of
# the preview's rendered script, so CI never fetches unvibe.site) installing the 0.1.50 RC setup from a build-only
# run, served from 127.0.0.1 with its SHA256SUMS line, on clean Windows Server 2022 + 2025, in Windows PowerShell
# 5.1 and pwsh. Extra fresh tries on 2025 measure the 0xC0000005 rate. Each profile's qa- id is flagged first.
# Runs on a push to qa/install-matrix whose commit message holds "[ps1-212" and "[rc:<build-only run id>]".
on:
  push:
    branches: [qa/install-matrix]

permissions:
  contents: read
  actions: read

concurrency:
  group: qa-ps1-212
  cancel-in-progress: false

jobs:
  row:
    if: contains(github.event.head_commit.message, '[ps1-212') && contains(github.event.head_commit.message, '[rc:')
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
        kind: [fresh, portable, setup, allusers, tamper, retrystub, tamperretry]
        attempt: [1]
        include:
          - { runner: windows-2025, shell: powershell, kind: fresh, attempt: 2 }
          - { runner: windows-2025, shell: powershell, kind: fresh, attempt: 3 }
          - { runner: windows-2025, shell: powershell, kind: fresh, attempt: 4 }
          - { runner: windows-2025, shell: powershell, kind: fresh, attempt: 5 }
          - { runner: windows-2025, shell: pwsh, kind: fresh, attempt: 2 }
          - { runner: windows-2025, shell: pwsh, kind: fresh, attempt: 3 }
          - { runner: windows-2025, shell: pwsh, kind: fresh, attempt: 4 }
          - { runner: windows-2025, shell: pwsh, kind: fresh, attempt: 5 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      INSTALL_ID: qa-ps1-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.shell }}-${{ matrix.kind }}-${{ matrix.attempt }}
      SCRIPT: install-212-a84c2796.ps1
      MSG: ${{ github.event.head_commit.message }}
    steps:
      # "[ps1-212:portable]" in the message runs only that kind; plain "[ps1-212]" runs every row.
      - name: Pick this row and the RC build
        id: pick
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
        run: |
          if [[ "$MSG" == *"[ps1-212:"* && "$MSG" != *"[ps1-212:$KIND]"* ]]; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "row skipped"; exit 0; fi
          rc=$(printf '%s' "$MSG" | sed -n 's/.*\[rc:\([0-9]*\)\].*/\1/p' | head -1)
          [[ "$rc" =~ ^[0-9]+$ ]] || { echo "::error::no [rc:<run id>] in the commit message"; exit 1; }
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; echo "RC_DIR=$RUNNER_TEMP/rc" >> "$GITHUB_ENV"; echo "RC build run $rc"
          # "[pb2]": the run id is the publish run, and the draft's own SHA256SUMS-windows.txt (committed next to
          # ps1-row.ps1 as pb2-SHA256SUMS-windows.txt) is served instead of a generated line (Security PB-2).
          if [[ "$MSG" == *"[pb2]"* ]]; then echo "PB2_SUMS=pb2-SHA256SUMS-windows.txt" >> "$GITHUB_ENV"; echo "PB-2: serving the draft's SHA256SUMS"; fi

      - name: Flag this id as QA before anything installs
        if: env.SKIP != '1'
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
        run: |
          [ -n "$UNVIBE_QA_FLAG_TOKEN" ] || { echo "::error::UNVIBE_QA_FLAG_TOKEN is not set. Nothing was installed."; exit 1; }
          code=$(printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -o /dev/null -w '%{http_code}' \
            -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' --data "{\"installId\":\"$INSTALL_ID\"}")
          echo "QA pre-flag $INSTALL_ID: $code"; [ "$code" = 200 ]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.SKIP != '1'
        with:
          sparse-checkout: |
            .github
            app/e2e

      - name: Get the RC build's setup.exe
        if: env.SKIP != '1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unvibe-windows-latest
          run-id: ${{ steps.pick.outputs.rc }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rc

      - name: Parse the row script
        if: env.SKIP != '1'
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\.github\qa\ps1-row.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'ps1-row.ps1 parses'

      - name: Playwright for the first explanation
        if: matrix.kind != 'tamper' && matrix.kind != 'tamperretry' && env.SKIP != '1'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install playwright@1.48.2 >/dev/null
          cp "$GITHUB_WORKSPACE/app/e2e/cdp-launch.mjs" "$GITHUB_WORKSPACE/.github/qa/first-explain.mjs" .

      - name: Install with #212's install.ps1, check, first explanation, uninstall
        if: env.SKIP != '1'
        shell: powershell
        run: .github\qa\ps1-row.ps1 -Kind "${{ matrix.kind }}" -Shell "${{ matrix.shell }}" -Out "$env:RUNNER_TEMP\m"

      - name: Flag again (whatever happened)
        if: always() && env.SKIP != '1'
        shell: bash
        env:
          UNVIBE_QA_FLAG_TOKEN: ${{ secrets.UNVIBE_QA_FLAG_TOKEN }}
        run: |
          taskkill //IM Unvibe.exe //F > /dev/null 2>&1 || true
          ids="$INSTALL_ID"
          s="$APPDATA/Unvibe/unvibe-store.json"
          [ -f "$s" ] && ids="$ids $(grep -o '"installId":"[^"]*"' "$s" | cut -d'"' -f4)"
          for x in $(echo $ids | tr ' ' '\n' | sort -u); do
            printf 'authorization: Bearer %s\n' "$UNVIBE_QA_FLAG_TOKEN" | curl -s -w " %{http_code} $x\n" \
              -X POST https://api.unvibe.site/api/v1/admin/qa-install -H @- -H 'content-type: application/json' --data "{\"installId\":\"$x\"}"
          done

      - name: Upload
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ps1-${{ matrix.runner }}-${{ matrix.shell }}-${{ matrix.kind }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/m
          retention-days: 14
